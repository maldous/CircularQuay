# Qualification target: GoReleaser OSS 2.19.0. This stages drafts only.
version: 2
project_name: cq
env:
  - CGO_ENABLED=0
snapshot:
  version_template: '1.0.0-dev.{{ .ShortCommit }}'
builds:
  - id: cq-linux
    main: ./cmd/cq
    binary: cq
    goos: [linux]
    goarch: [386, arm, arm64, amd64, loong64, ppc64le, riscv64, s390x]
    goarm: [7]
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X github.com/maldous/CircularQuay/internal/cli.Version={{ .Version }} -X github.com/maldous/CircularQuay/internal/cli.Commit={{ .FullCommit }}
  - id: cq-darwin
    main: ./cmd/cq
    binary: cq
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X github.com/maldous/CircularQuay/internal/cli.Version={{ .Version }} -X github.com/maldous/CircularQuay/internal/cli.Commit={{ .FullCommit }}
  - id: cq-windows
    main: ./cmd/cq
    binary: cq
    goos: [windows]
    goarch: [386, amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X github.com/maldous/CircularQuay/internal/cli.Version={{ .Version }} -X github.com/maldous/CircularQuay/internal/cli.Commit={{ .FullCommit }}
  - id: cq-portable-unix
    main: ./cmd/cq
    binary: cq
    goos: [freebsd, netbsd, openbsd, dragonfly, illumos, solaris]
    goarch: [386, amd64, arm64]
    ignore:
      - goos: dragonfly
        goarch: 386
      - goos: dragonfly
        goarch: arm64
      - goos: illumos
        goarch: 386
      - goos: illumos
        goarch: arm64
      - goos: solaris
        goarch: 386
      - goos: solaris
        goarch: arm64
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X github.com/maldous/CircularQuay/internal/cli.Version={{ .Version }} -X github.com/maldous/CircularQuay/internal/cli.Commit={{ .FullCommit }}
  - id: cq-audit-linux
    main: ./cmd/cq-audit
    binary: cq-audit
    goos: [linux]
    goarch: [386, arm, arm64, amd64, loong64, ppc64le, riscv64, s390x]
    goarm: [7]
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
  - id: cq-audit-darwin
    main: ./cmd/cq-audit
    binary: cq-audit
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
  - id: cq-audit-windows
    main: ./cmd/cq-audit
    binary: cq-audit
    goos: [windows]
    goarch: [386, amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
  - id: cq-audit-portable-unix
    main: ./cmd/cq-audit
    binary: cq-audit
    goos: [freebsd, netbsd, openbsd, dragonfly, illumos, solaris]
    goarch: [386, amd64, arm64]
    ignore:
      - goos: dragonfly
        goarch: 386
      - goos: dragonfly
        goarch: arm64
      - goos: illumos
        goarch: 386
      - goos: illumos
        goarch: arm64
      - goos: solaris
        goarch: 386
      - goos: solaris
        goarch: arm64
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
archives:
  - id: native
    ids: [cq-linux, cq-darwin, cq-windows, cq-portable-unix, cq-audit-linux, cq-audit-darwin, cq-audit-windows, cq-audit-portable-unix]
    name_template: 'cq_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - RELEASE.md
      - SECURITY.md
      - SUPPORT.md
      - CHANGELOG.md
      - docs/**
      - examples/**
      - internal/policy/schema/policy-v1.schema.json
      - integrations/skills/cq/**
checksum:
  name_template: 'cq_{{ .Version }}_checksums.txt'
  algorithm: sha256
source:
  enabled: true
  name_template: 'cq_{{ .Version }}_source'
release:
  github:
    owner: maldous
    name: CircularQuay
  draft: true
  prerelease: auto
  name_template: 'CQ {{ .Tag }}'
  make_latest: false
