# Supplemental candidate evidence. Existing PR and release gates remain authoritative.
# Refresh moved source pins in a reviewed change before dispatching again.
name: Frozen candidate qualification
run-name: Frozen candidate qualification (${{ github.event_name == 'pull_request' && 'Intel Darwin native prerequisites' || inputs.candidate }})

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/frozen-candidate-qualification.yml']
  workflow_dispatch:
    inputs:
      candidate:
        description: Reviewed candidate to combine with the pinned feature tip
        required: true
        type: choice
        options: [health, python, darwin, darwin-inputs, cpython-inputs, cpython-provenance, darwin-native-prerequisites]

permissions:
  contents: read

concurrency:
  group: frozen-candidate-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.candidate }}
  cancel-in-progress: false

env:
  CQ_NATIVE_FEATURE_SHA: '941adf3f84a49905d7244bb594fbf517dff9bc32'
  CQ_NATIVE_FEATURE_TREE: '00434f4681afc7b2584d628199c22287f7c9df01'
  CQ_NATIVE_INPUT_SHA: 'b8447db3be2c25e73671a13bfe3a86a0d286cbc3'
  CQ_FEATURE_SHA: '19d458e0289e90edd02da93faba41bf5f5e4991c'
  CQ_HEALTH_SHA: 'ce1d4c66816ef6f7ea353dd4611b04bf577ac7b2'
  CQ_GO_REPAIR_SHA: 'eeb1a8e6249cfee86dc657a98b68aef42dc3ccd9'
  CQ_ALIAS_SHA: '87bf5042c3707b93227b14f48c57ea8cda44a4f0'
  CQ_DARWIN_SHA: '63ce3c404bd5ac23cf402112d873ff7175a5f8ff'
  CQ_PYTHON_PARENT_SHA: '83e7cf92df673864be6f46b985b657d1bc4f9e27'
  CQ_PYTHON_SHA: '87a9c08e968f44a78df67ddc8dd1bb1d057a6f4e'

jobs:
  health:
    if: >-
      ${{ github.repository == 'maldous/CircularQuay' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate == 'health' }}
    name: Candidate Go build, tests and analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CQ_CANDIDATE: health
      GOMAXPROCS: '2'
      GOFLAGS: '-mod=readonly -p=1'
      GOTOOLCHAIN: local
    steps:
      - &checkout_feature
        name: Check out the reviewed feature history
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ env.CQ_FEATURE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - &composite_checkout
        name: Verify frozen refs and create the candidate composite
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          case "$CQ_CANDIDATE" in
            health) ref=fix/cq-health-readiness; candidate="$CQ_HEALTH_SHA" ;;
            python) ref=fix/cq-python-windows-portability; candidate="$CQ_PYTHON_SHA" ;;
            *) echo 'Unsupported candidate' >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$CQ_FEATURE_SHA"
          test "$(git rev-parse refs/remotes/origin/feature/initial-implementation)" = "$CQ_FEATURE_SHA"
          test "$(git rev-parse "refs/remotes/origin/$ref")" = "$candidate"
          go_ref=fix/cq-go-1.27.4
          test "$(git rev-parse "refs/remotes/origin/$go_ref")" = "$CQ_GO_REPAIR_SHA"
          test "$(git rev-parse "$CQ_GO_REPAIR_SHA^")" = "$CQ_FEATURE_SHA"
          if test "$CQ_CANDIDATE" = python; then
            test "$(git rev-parse "$candidate^")" = "$CQ_PYTHON_PARENT_SHA"
          fi
          integration="$CQ_GO_REPAIR_SHA"
          if test "$CQ_CANDIDATE" = health; then
            alias_ref=security/cq-gosec-boundaries
            test "$(git rev-parse "refs/remotes/origin/$alias_ref")" = "$CQ_ALIAS_SHA"
            test "$(git rev-parse "$CQ_ALIAS_SHA^")" = "$CQ_GO_REPAIR_SHA"
            test "$(git ls-remote --exit-code origin "refs/heads/$alias_ref")" = "$(printf '%s\trefs/heads/%s' "$CQ_ALIAS_SHA" "$alias_ref")"
            integration="$CQ_ALIAS_SHA"
          fi
          # A moved remote branch must fail closed, even after checkout.
          test "$(git ls-remote --exit-code origin refs/heads/feature/initial-implementation)" = "$(printf '%s\trefs/heads/feature/initial-implementation' "$CQ_FEATURE_SHA")"
          test "$(git ls-remote --exit-code origin "refs/heads/$ref")" = "$(printf '%s\trefs/heads/%s' "$candidate" "$ref")"
          test "$(git ls-remote --exit-code origin "refs/heads/$go_ref")" = "$(printf '%s\trefs/heads/%s' "$CQ_GO_REPAIR_SHA" "$go_ref")"
          tree="$(git merge-tree --write-tree "$integration" "$candidate")"
          # Keep the unpublished composite identity stable across jobs.
          stamp="$(git show -s --format=%cI "$CQ_FEATURE_SHA")"
          export GIT_AUTHOR_NAME='CircularQuay CI' GIT_AUTHOR_EMAIL='ci@example.invalid'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="$stamp" GIT_COMMITTER_DATE="$stamp"
          composite="$(printf 'Qualify frozen CircularQuay candidate\n' |
            git -c commit.gpgSign=false commit-tree "$tree" -p "$integration" -p "$candidate")"
          git -c core.hooksPath=/dev/null checkout --detach "$composite"
          test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
          test -z "$(git status --porcelain)"
          git diff --check "$CQ_FEATURE_SHA" HEAD
          {
            printf 'Feature: %s\n\n' "$CQ_FEATURE_SHA"
            printf 'Go repair: %s\n\n' "$CQ_GO_REPAIR_SHA"
            if test "$CQ_CANDIDATE" = health; then
              printf 'Alias repair: %s\n\n' "$CQ_ALIAS_SHA"
            fi
            printf 'Candidate: %s\n\n' "$candidate"
            if test "$CQ_CANDIDATE" = python; then
              printf 'Original Python candidate: %s\n\n' "$CQ_PYTHON_PARENT_SHA"
            fi
            printf 'Composite: %s\n\n' "$composite"
            printf 'Tree: %s\n' "$tree"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.1
        id: go_setup
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build cq and run the native synthetic suite
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(go env GOVERSION)" = go1.27.4
          go mod verify
          go build -trimpath -o "$RUNNER_TEMP/cq" ./cmd/cq
          go test -count=1 ./...
          go vet ./...
      - name: Verify native alias rejection and script invocation
        if: ${{ !cancelled() && steps.go_setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -x /usr/bin/true
          go test -count=1 -v -run '^(TestExecutableAlias.*|TestPinnedScriptAliasPreservesConfiguredInvocationPath)$' ./internal/platform
      - name: Enforce complexity ceilings
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          go install github.com/uudashr/gocognit/cmd/gocognit@v1.3.0
          mapfile -d '' go_sources < <(git ls-files -z '*.go')
          "$GOBIN/gocyclo" -over 10 "${go_sources[@]}"
          cq_cognitive_log="$RUNNER_TEMP/cq-cognitive.log"
          # Type-aware analysis loads each native package once per owning
          # directory. Treat warnings/fallback diagnostics as a failed check.
          if ! "$GOBIN/gocognit" -exact-recursion -over 10 internal cmd sdk/go >"$cq_cognitive_log" 2>&1; then
            cat "$cq_cognitive_log"
            exit 1
          fi
          if test -s "$cq_cognitive_log"; then
            cat "$cq_cognitive_log"
            exit 1
          fi
      - name: Install pinned analysis tools
        id: security_tools
        if: ${{ always() && steps.go_setup.outcome == 'success' }}
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/go-security-tools
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
      - name: Run Staticcheck
        if: ${{ always() && steps.security_tools.outcome == 'success' }}
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/go-security-tools
        run: |
          set -euo pipefail
          "$GOBIN/staticcheck" -checks=all ./...
      - name: Run govulncheck
        if: ${{ always() && steps.security_tools.outcome == 'success' }}
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/go-security-tools
        run: |
          set -euo pipefail
          "$GOBIN/govulncheck" ./...
      - name: Run gosec without exclusions
        if: ${{ always() && steps.security_tools.outcome == 'success' }}
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/go-security-tools
        run: |
          set -euo pipefail
          "$GOBIN/gosec" -nosec ./...

  native-platforms:
    if: >-
      ${{ github.repository == 'maldous/CircularQuay' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate == 'health' }}
    name: Candidate native launch compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-2025]
    env:
      CQ_CANDIDATE: health
      GOMAXPROCS: '2'
      GOFLAGS: '-mod=readonly -p=1'
      GOTOOLCHAIN: local
    steps:
      - *checkout_feature
      - *composite_checkout
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.1
        with:
          go-version: '1.27.4'
          cache: false
      - name: Run native Unix launch regressions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PATH="/usr/bin:/bin:$PATH"
          test "$(go env GOVERSION)" = go1.27.4
          test -x /usr/bin/true
          go test -count=1 -v -run '^(TestExecutableAlias.*|TestPinnedScriptAliasPreservesConfiguredInvocationPath)$' ./internal/platform
          go test -count=1 ./internal/platform ./internal/repository ./internal/source ./internal/quota ./internal/assurance
      - name: Run native Windows launch regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ((go env GOVERSION) -ne 'go1.27.4') { throw 'Go pin mismatch' }
          go test -count=1 ./internal/platform ./internal/repository ./internal/source ./internal/quota ./internal/assurance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  darwin-preflight:
    if: >-
      ${{ github.repository == 'maldous/CircularQuay' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate == 'darwin' }}
    name: Candidate Intel Darwin preparation (no wheel build)
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - &darwin_source_checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.CQ_DARWIN_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - &darwin_lock_verification
        name: Verify the reviewed build-input bytes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$CQ_DARWIN_SHA"
          test "$(git rev-parse HEAD^)" = "$CQ_FEATURE_SHA"
          test "$(git ls-remote --exit-code origin refs/heads/feature/initial-implementation)" = "$(printf '%s\trefs/heads/feature/initial-implementation' "$CQ_FEATURE_SHA")"
          test "$(git ls-remote --exit-code origin refs/heads/build/cq-darwin-source-inputs)" = "$(printf '%s\trefs/heads/build/cq-darwin-source-inputs' "$CQ_DARWIN_SHA")"
          python3 -I - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          sdk = Path("sdk/python")
          inputs = json.loads((sdk / "darwin-build-inputs.json").read_text())
          native = json.loads((sdk / "darwin-native-toolchain.json").read_text())
          source = json.loads((sdk / "darwin-source-policy.json").read_text())
          assert (source["package"], source["version"], source["platform"], source["architecture"]) == ("cryptography", "50.0.2", "darwin", "x86_64")
          assert inputs["source_date_epoch"] == native["build_settings"]["source_date_epoch"]
          assert native["openssl"]["sha256"] is None
          assert native["apple"]["developer_dir"] == "/Applications/Xcode_16.4.app/Contents/Developer"
          assert (native["apple"]["xcode_version"], native["apple"]["xcode_build"], native["apple"]["macos_sdk_version"]) == ("16.4", "16F6", "15.5")
          assert inputs["source_policy"] == "sdk/python/darwin-source-policy.json"
          assert inputs["direct_requirements"] == "sdk/python/requirements-darwin-build.txt"
          closures = inputs["closures"]
          assert len(closures) == 5
          assert {entry["lock"] for entry in closures} == {f"sdk/python/locks/build-darwin-py3{minor}.txt" for minor in range(11, 16)}
          pins = [(inputs["source_policy"], inputs["source_policy_sha256"]),
                  (inputs["direct_requirements"], inputs["direct_requirements_sha256"])]
          pins.extend((entry["lock"], entry["lock_sha256"]) for entry in closures)
          for path, digest in pins:
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          PY
          for minor in 311 312 313 314 315; do
            python3 .github/scripts/sdk_python_lock.py \
              --verify-lock "sdk/python/locks/build-darwin-py$minor.txt" \
              --requirements sdk/python/requirements-darwin-build.txt
          done
          {
            printf 'Darwin input candidate: %s\n' "$CQ_DARWIN_SHA"
            printf 'Feature: %s\n' "$CQ_FEATURE_SHA"
            printf 'Tree: %s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'Only preparation. OpenSSL digest is still missing. No wheel built.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the proposed native Apple toolchain
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = x86_64
          printf 'Hosted image variables: %s / %s\n' "$(printenv ImageOS || printf 'not exposed')" "$(printenv ImageVersion || printf 'not exposed')"
          sw_vers
          /usr/bin/xcodebuild -version
          /usr/bin/xcrun clang --version
          /usr/bin/xcrun --sdk macosx --show-sdk-version
          python3 -I -c 'import platform, sys; assert platform.machine() == "x86_64"; print(sys.executable, sys.version)'
          test "$(/usr/bin/xcodebuild -version)" = "$(printf 'Xcode 16.4\nBuild version 16F6')"
          test "$(/usr/bin/xcrun --sdk macosx --show-sdk-version)" = 15.5
          /usr/bin/codesign --verify --deep --strict -R='anchor apple' /Applications/Xcode_16.4.app

  darwin-inputs:
    if: >-
      ${{ github.repository == 'maldous/CircularQuay' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate == 'darwin-inputs' }}
    name: Candidate Intel Darwin Rust verification and CPython observations
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - *darwin_source_checkout
      - *darwin_lock_verification
      - &match_verified_apple
        name: Match the previously verified Apple runner
        id: apple_identity
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = x86_64
          test "$(printenv ImageOS)" = macos15
          test "$(printenv ImageVersion)" = 20260824.0482.1
          test "$(/usr/bin/xcodebuild -version)" = "$(printf 'Xcode 16.4\nBuild version 16F6')"
          test "$(/usr/bin/xcrun --sdk macosx --show-sdk-version)" = 15.5
          printf 'Matched Apple signature evidence: run 43148993341, job 130953451534.\n' >> "$GITHUB_STEP_SUMMARY"
          sw_vers
          /usr/bin/xcrun clang --version
      - &observe_native_python
        name: Read native CPython identities without installing interpreters
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path

          assert sys.platform == "darwin" and platform.machine() == "x86_64"
          print("### Native CPython observations (no pins selected)")
          print(f"Runner interpreter: {sys.executable}, {platform.python_version()}, {platform.machine()}.")
          tool_cache = Path(os.environ["RUNNER_TOOL_CACHE"])
          observed = ("3.11.9", "3.12.10", "3.13.17", "3.14.10", "3.15.2")
          probe = "import json,platform,sys; print(json.dumps([platform.python_version(),platform.machine(),sys.platform]))"
          failures = []
          for version in observed:
              prefix = tool_cache / "Python" / version / "x64"
              path = prefix / "bin" / "python3"
              if not path.is_file():
                  print(f"- {version}: not in this runner cache; no acquisition attempted.")
                  continue
              resolved = path.resolve()
              if not resolved.is_relative_to(prefix.resolve()):
                  failures.append(version)
                  print(f"- {version}: {path} resolves to {resolved}, outside {prefix}; not executed.")
                  continue
              try:
                  result = subprocess.run([str(resolved), "-I", "-c", probe], capture_output=True, text=True, timeout=15, check=True)
                  identity = json.loads(result.stdout)
                  if identity != [version, "x86_64", "darwin"]:
                      raise ValueError("native identity did not match")
                  pip = subprocess.run([str(resolved), "-I", "-m", "pip", "--version"], capture_output=True, text=True, timeout=15, check=True)
              except (OSError, ValueError, subprocess.SubprocessError):
                  failures.append(version)
                  print(f"- {version}: native interpreter or pip identity probe failed.")
                  continue
              print(f"- {version}: native interpreter readback passed at {resolved}; {pip.stdout.strip()}. Archive identity is unverified.")
          print("Exact reviewed acquisition and pip frontend receipts remain required for the wheel build.")
          if failures:
              raise SystemExit(f"Unverified CPython observations: {', '.join(failures)}")
          PY
      - name: Acquire and verify the pinned Rust archive
        id: rust_input
        if: ${{ !cancelled() && steps.apple_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          input_root="$(mktemp -d "$RUNNER_TEMP/cq-rust-input.XXXXXX")"
          printf 'root=%s\n' "$input_root" >> "$GITHUB_OUTPUT"
          python3 -I - "$input_root" <<'PY'
          import hashlib
          import json
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath
          from urllib.request import HTTPRedirectHandler, build_opener

          root = Path(sys.argv[1])
          native = json.loads(Path("sdk/python/darwin-native-toolchain.json").read_text())
          rust = native["rust"]
          assert native["platform"] == "darwin" and native["architecture"] == "x86_64"
          assert native["openssl"]["sha256"] is None
          assert (rust["version"], rust["target"]) == ("1.99.1", "x86_64-apple-darwin")
          archive_name = "rust-1.99.1-x86_64-apple-darwin"
          url = f"https://static.rust-lang.org/dist/2026-10-15/{archive_name}.tar.xz"
          sha256 = "13b237d0294bad3bb7b18d559517947ed8348ea25812fa3b468c904996f80e34"
          assert (rust["url"], rust["sha256"]) == (url, sha256)

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError("Rust archive redirect is not admitted")

          archive = root / f"{archive_name}.tar.xz"
          digest = hashlib.sha256()
          size = 0
          with build_opener(NoRedirect).open(url, timeout=60) as response, archive.open("xb") as output:
              for data in iter(lambda: response.read(1024 * 1024), b""):
                  size += len(data)
                  if size > 384 * 1024 * 1024:
                      raise RuntimeError("Rust archive exceeds acquisition bound")
                  digest.update(data)
                  output.write(data)
          if digest.hexdigest() != sha256:
              raise RuntimeError("Rust archive digest mismatch")
          print(f"Verified Rust archive SHA-256: {sha256}; {size} bytes.", flush=True)
          with tarfile.open(archive, mode="r:xz") as source:
              members = []
              expanded = 0
              for member in source:
                  path = PurePosixPath(member.name)
                  if not path.parts or path.parts[0] != archive_name or ".." in path.parts or path.is_absolute():
                      raise RuntimeError("Unexpected Rust archive member")
                  members.append(member)
                  expanded += member.size
                  if len(members) > 30000 or expanded > 3 * 1024 * 1024 * 1024:
                      raise RuntimeError("Rust extraction exceeds bound")
              source.extractall(root, members=members, filter="data")
          PY
      - name: Verify the native Rust compiler and cargo
        if: ${{ !cancelled() && steps.rust_input.outcome == 'success' }}
        shell: bash
        env:
          CQ_INPUT_ROOT: ${{ steps.rust_input.outputs.root }}
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -euo pipefail
          umask 077
          cd "$CQ_INPUT_ROOT"
          export CARGO_HOME="$CQ_INPUT_ROOT/cargo"
          export RUSTUP_HOME="$CQ_INPUT_ROOT/rustup"
          /bin/sh ./rust-1.99.1-x86_64-apple-darwin/install.sh --prefix="$CQ_INPUT_ROOT/rust"
          compiler="$CQ_INPUT_ROOT/rust/bin/rustc"
          cargo="$CQ_INPUT_ROOT/rust/bin/cargo"
          "$compiler" --version --verbose | tee rustc.txt
          "$cargo" --version | tee cargo.txt
          grep -Fx 'release: 1.99.1' rustc.txt
          grep -Fx 'host: x86_64-apple-darwin' rustc.txt
          grep -E '^cargo 1\.99\.1( |$)' cargo.txt
          printf 'fn main() { println!("native-rust-ok"); }\n' > probe.rs
          "$compiler" --target x86_64-apple-darwin -o probe probe.rs
          test "$(./probe)" = native-rust-ok
          {
            printf '\n### Verified Rust input (no OpenSSL or wheel build)\n'
            printf 'Archive SHA-256: 13b237d0294bad3bb7b18d559517947ed8348ea25812fa3b468c904996f80e34\n\n'
            cat rustc.txt cargo.txt
            printf '\nNative Intel fixture compiled and executed.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  cpython-inputs:
    if: >-
      ${{ github.repository == 'maldous/CircularQuay' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate == 'cpython-inputs' }}
    name: Candidate Intel Darwin CPython cache observations
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - *darwin_source_checkout
      - *darwin_lock_verification
      - *match_verified_apple
      - *observe_native_python

  cpython-provenance:
    if: >-
      ${{ github.repository == 'maldous/CircularQuay' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate == 'cpython-provenance' }}
    name: Candidate Intel CPython provenance (${{ matrix.version }}, ${{ matrix.mode }})
    runs-on: macos-15-intel
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '3.11.9'
            mode: framework
            url: 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg'
            sha256: 'b6cfdee2571ca56ee895043ca1e7110fb78a878cee3eb0c21accb2de34d24b55'
          - version: '3.12.10'
            mode: framework
            url: 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg'
            sha256: '8373e58da4ea146b3eb1c1f9834f19a319440b6b679b06050b1f9ee3237aa8e4'
          - version: '3.13.17'
            mode: archive
            url: 'https://github.com/actions/python-versions/releases/download/3.13.17-39711892467/python-3.13.17-darwin-x64.tar.gz'
            sha256: 'c295dedca816c7aed4a980591b6d5ff81cd7f22ba3cb4a871c2d2fbc26dba050'
          - version: '3.14.10'
            mode: archive
            url: 'https://github.com/actions/python-versions/releases/download/3.14.10-40336797752/python-3.14.10-darwin-x64.tar.gz'
            sha256: '82d456f964cb3138ff3914a4004b1c551e9793f07e0d4deeae407c0d121bbaed'
          - version: '3.15.2'
            mode: archive
            url: 'https://github.com/actions/python-versions/releases/download/3.15.2-40340363276/python-3.15.2-darwin-x64.tar.gz'
            sha256: '3598759050401152244152503382874410ef8071fb1156544a3bd233ddcf148f'
    steps:
      - *darwin_source_checkout
      - *darwin_lock_verification
      - *match_verified_apple
      - name: Verify signed CPython input and inspect native identity
        shell: bash
        env:
          INPUT_VERSION: ${{ matrix.version }}
          INPUT_MODE: ${{ matrix.mode }}
          INPUT_URL: ${{ matrix.url }}
          INPUT_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          umask 077
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import plistlib
          import re
          import stat
          import subprocess
          import tarfile
          import tempfile
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, build_opener

          version, mode, url, expected = (os.environ[key] for key in ("INPUT_VERSION", "INPUT_MODE", "INPUT_URL", "INPUT_SHA256"))
          minor = ".".join(version.split(".")[:2])
          work = Path(tempfile.mkdtemp(prefix="cq-cpython-input-", dir=os.environ["RUNNER_TEMP"]))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          receipt = {"python": version, "mode": mode, "url": url, "source": os.environ["CQ_DARWIN_SHA"]}
          requirement = '=anchor apple generic and certificate leaf[subject.OU] = "BMM5U3QVKW"'
          bundle = Path(f"/Library/Frameworks/Python.framework/Versions/{minor}")

          def command(*argv, timeout=120):
              result = subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, check=False, timeout=timeout)
              if result.returncode:
                  print(result.stdout[:4096], flush=True)
                  raise RuntimeError(f"{Path(argv[0]).name} failed with status {result.returncode}")
              return result.stdout

          def file_hash(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          def copy_bounded(reader, target, limit):
              size = 0
              digest = hashlib.sha256()
              with target.open("xb") as out:
                  for chunk in iter(lambda: reader.read(1024 * 1024), b""):
                      size += len(chunk)
                      if size > limit:
                          raise RuntimeError("Python input exceeds acquisition bound")
                      digest.update(chunk)
                      out.write(chunk)
              return digest.hexdigest(), size

          class ReleaseRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  parsed = urlsplit(newurl)
                  if mode != "archive" or parsed.scheme != "https" or parsed.netloc != "release-assets.githubusercontent.com":
                      raise RuntimeError("Unapproved Python input redirect")
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          def packaged_inputs():
              pkg = work / "python.pkg"
              host = urlsplit(url).netloc
              if mode == "framework":
                  assert host == "www.python.org"
                  assert url == f"https://www.python.org/ftp/python/{version}/python-{version}-macos11.pkg"
                  with build_opener(ReleaseRedirect).open(url, timeout=60) as stream:
                      receipt["installer_sha256"], receipt["installer_bytes"] = copy_bounded(stream, pkg, 100 * 1024 * 1024)
                  if receipt["installer_sha256"] != expected:
                      raise RuntimeError("Python.org installer hash mismatch")
              else:
                  assert mode == "archive" and host == "github.com"
                  assert url.endswith(f"/python-{version}-darwin-x64.tar.gz")
                  archive = work / "release.tar.gz"
                  with build_opener(ReleaseRedirect).open(url, timeout=60) as stream:
                      digest, size = copy_bounded(stream, archive, 128 * 1024 * 1024)
                  if digest != expected:
                      raise RuntimeError("Python release archive hash mismatch")
                  receipt["verified_archive_sha256"] = digest
                  receipt["archive_bytes"] = size
                  with tarfile.open(archive, "r:gz") as tar:
                      members = [m for m in tar if m.isfile() and PurePosixPath(m.name).suffix.lower() == ".pkg"]
                      if len(members) != 1:
                          raise RuntimeError("Expected one packaged Python installer")
                      with tar.extractfile(members[0]) as stream:
                          receipt["installer_sha256"], receipt["installer_bytes"] = copy_bounded(stream, pkg, 100 * 1024 * 1024)
              signed = command("/usr/sbin/pkgutil", "--check-signature", str(pkg))
              print(signed, flush=True)
              required = {
                  "Status: signed by a developer certificate issued by Apple for distribution",
                  "Notarization: trusted by the Apple notary service",
                  "1. Developer ID Installer: Python Software Foundation (BMM5U3QVKW)",
              }
              if not required.issubset({line.strip() for line in signed.splitlines()}):
                  raise RuntimeError("Python Software Foundation installer signature not verified")
              receipt["installer_signer"] = "Python Software Foundation (BMM5U3QVKW)"
              expanded = work / "expanded"
              # Inspect the verified package; do not execute installer scripts or change system state.
              command("/usr/sbin/pkgutil", "--expand-full", str(pkg), str(expanded))
              package_id = f"org.python.Python.PythonFramework-{minor}"
              components = []
              for info in expanded.rglob("PackageInfo"):
                  attrib = ET.parse(info).getroot().attrib
                  payload = info.parent / "Payload"
                  if attrib.get("identifier") != package_id or not payload.is_dir():
                      continue
                  binaries = [p for p in payload.rglob(f"python{minor}") if p.parent.name == "bin" and p.is_file()]
                  for binary in binaries:
                      root = binary.parent.parent
                      if (root / "Python").is_file() and binary.resolve().is_relative_to(payload.resolve()) and (root / "Python").resolve().is_relative_to(payload.resolve()):
                          components.append((attrib, root, binary.resolve()))
              if len(components) != 1:
                  raise RuntimeError("Could not bind a unique signed Python framework component")
              return components[0]

          def verify_binary(path):
              command("/usr/bin/codesign", "--verify", "--strict", "-R", requirement, str(path))
              command("/usr/bin/lipo", str(path), "-verify_arch", "x86_64")
              return file_hash(path)

          def immutable_system_target(path):
              for entry in (path, *path.parents):
                  info = entry.stat()
                  if info.st_uid != 0 or stat.S_IMODE(info.st_mode) & 0o022:
                      raise RuntimeError(f"System framework entry is not root protected: {entry}")

          try:
              info, staged, binary = packaged_inputs()
              receipt["package_id"] = info["identifier"]
              receipt["component_version"] = info["version"]
              # Apple component metadata is not the CPython patch version.
              if info["version"] != "0":
                  raise RuntimeError("Unexpected Python framework component metadata")
              include = staged / "include"
              headers = list(include.glob("python*/patchlevel.h"))
              if len(headers) != 1 or not headers[0].resolve().is_relative_to(staged.resolve()):
                  raise RuntimeError("Could not bind the signed CPython version header")
              declared = re.findall(r'^#define[ \t]+PY_VERSION[ \t]+"([^"]+)"[ \t]*$', headers[0].read_text(encoding="ascii"), re.MULTILINE)
              if declared != [version]:
                  raise RuntimeError("Signed framework payload patch version differs")
              receipt["package_python_version"] = declared[0]
              receipt["patchlevel_header_sha256"] = file_hash(headers[0])
              library = (staged / "Python").resolve()
              receipt["package_interpreter_sha256"] = verify_binary(binary)
              receipt["package_framework_sha256"] = verify_binary(library)
              receipt["package_load_commands"] = command("/usr/bin/otool", "-L", str(binary)).splitlines()[1:]
              bundled = list((staged / "lib" / f"python{minor}" / "ensurepip" / "_bundled").glob("pip-*.whl"))
              if len(bundled) != 1 or not bundled[0].resolve().is_relative_to(staged.resolve()):
                  raise RuntimeError("Signed bundled pip input not identified")
              pip = bundled[0].resolve()
              receipt["bundled_pip"] = {"name": pip.name, "sha256": file_hash(pip)}
              if mode != "framework":
                  receipt["status"] = "archive and signed package verified; task-local native installation not admitted"
                  print("Staged provenance complete. Native interpreter and pip execution held: official installer requires a system target.", flush=True)
                  raise SystemExit(0)
              alias = Path(os.environ["RUNNER_TOOL_CACHE"]) / "Python" / version / "x64/bin/python3"
              installed = (bundle / "bin" / f"python{minor}").resolve(strict=True)
              installed_library = (bundle / "Python").resolve(strict=True)
              if alias.resolve(strict=True) != installed or not installed.is_relative_to(bundle) or not installed_library.is_relative_to(bundle):
                  raise RuntimeError("Installed framework target differs from reviewed path")
              for path in (installed, installed_library):
                  immutable_system_target(path)
              receipt["installed_interpreter"] = str(installed)
              installed_info = plistlib.loads(command("/usr/sbin/pkgutil", "--pkg-info-plist", info["identifier"]).encode())
              if (installed_info.get("pkgid"), installed_info.get("pkg-version")) != (info["identifier"], info["version"]):
                  raise RuntimeError("Installed package receipt differs from signed component metadata")
              receipt["installed_receipt"] = {key: installed_info.get(key) for key in ("pkgid", "pkg-version", "volume", "install-location")}
              if verify_binary(installed) != receipt["package_interpreter_sha256"] or verify_binary(installed_library) != receipt["package_framework_sha256"]:
                  raise RuntimeError("Installed executable or framework differs from signed installer bytes")
              script = "import json,platform,sys; print(json.dumps([platform.python_version(), platform.machine(), sys.platform, sys.base_prefix]))"
              identity = json.loads(command(str(installed), "-I", "-S", "-c", script))
              if identity != [version, "x86_64", "darwin", str(bundle)]:
                  raise RuntimeError("Native interpreter identity differs")
              receipt["native_identity"] = identity
              pip_probe = "import runpy,sys; sys.path.insert(0,sys.argv[1]); sys.argv=['pip','--version']; runpy.run_module('pip',run_name='__main__')"
              receipt["pip_frontend"] = command(str(installed), "-I", "-S", "-c", pip_probe, str(pip)).strip()
              receipt["status"] = "installed signed interpreter and bundled pip identity verified"
          finally:
              detail = json.dumps(receipt, indent=2, sort_keys=True)
              print(detail, flush=True)
              with summary.open("a", encoding="utf-8") as output:
                  output.write("\n### CPython input receipt (no wheel build)\n\n")
                  output.write("~~~json\n" + detail + "\n~~~\n")
          PY

  python-static-security:
    if: >-
      ${{ github.repository == 'maldous/CircularQuay' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate == 'python' }}
    name: Candidate Python static and security (3.14, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
    env:
      CQ_CANDIDATE: python
    steps:
      - *checkout_feature
      - *composite_checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14', check-latest: true }
      - name: Install reviewed static-tool closure
        id: static_tools
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in Linux) p=linux;; macOS) p=darwin;; Windows) p=win32;; *) exit 1;; esac
          lock="sdk/python/locks/ci-${p}-py314.txt"
          test -f "$lock"
          python .github/scripts/sdk_python_lock.py --verify-lock "$lock" --requirements sdk/python/requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: -r "$lock"
      - name: Test lock helper
        if: ${{ always() && steps.static_tools.outcome == 'success' }}
        shell: bash
        run: python -m unittest discover -s .github/scripts/tests -v
      - name: Lint Python SDK
        id: python_ruff
        if: ${{ always() && steps.static_tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python .github/scripts/sdk_python_check.py --check ruff --report "$RUNNER_TEMP/cq-python-reports/ruff.json" --timeout-seconds 300
      - name: Typecheck Python SDK
        id: python_mypy
        if: ${{ always() && steps.static_tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python .github/scripts/sdk_python_check.py --check mypy --report "$RUNNER_TEMP/cq-python-reports/mypy.json" --timeout-seconds 300
      - name: Bandit Python SDK
        id: python_bandit
        if: ${{ always() && steps.static_tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python .github/scripts/sdk_python_check.py --check bandit --report "$RUNNER_TEMP/cq-python-reports/bandit.json" --timeout-seconds 300
      - name: Upload Python static analyzer evidence
        if: ${{ always() && steps.static_tools.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-static-analyzers-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/cq-python-reports/ruff.json
            ${{ runner.temp }}/cq-python-reports/mypy.json
            ${{ runner.temp }}/cq-python-reports/bandit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Audit every reviewed Python lock
        if: ${{ always() && steps.static_tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in Linux) p=linux;; macOS) p=darwin;; Windows) p=win32;; *) exit 1;; esac
          python -m pip_audit --strict --disable-pip --require-hashes -r "sdk/python/locks/ci-${p}-py314.txt"
          for platform in linux darwin win32; do for interpreter in py311 py312 py313 py314 py315; do
            lock="sdk/python/locks/runtime-${platform}-${interpreter}.txt"
            test -f "$lock"
            python -m pip_audit --strict --disable-pip --require-hashes -r "$lock"
          done; done
      - name: Measure Python SDK coverage
        id: python_static_coverage
        if: ${{ always() && steps.static_tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python .github/scripts/sdk_python_check.py --check coverage --report "$RUNNER_TEMP/cq-python-reports/coverage.json" --progress "$RUNNER_TEMP/cq-python-reports/coverage-progress.json" --timeout-seconds 1200
      - name: Upload Python static coverage evidence
        if: ${{ always() && steps.static_tools.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-static-coverage-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/cq-python-reports/coverage.json
            ${{ runner.temp }}/cq-python-reports/coverage-progress.json
          if-no-files-found: warn
          retention-days: 7
      - name: Build Python SDK static lane
        if: ${{ always() && steps.static_tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m build --no-isolation --outdir "$RUNNER_TEMP/cq-python-static-dist" sdk/python

  python:
    if: >-
      ${{ github.repository == 'maldous/CircularQuay' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate == 'python' }}
    name: Candidate Python SDK (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      CQ_CANDIDATE: python
      GOMAXPROCS: '2'
      GOFLAGS: '-mod=readonly -p=1'
      GOTOOLCHAIN: local
    steps:
      - *checkout_feature
      - *composite_checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Resolve or verify Python SDK lock evidence
        id: python_lock
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/cq-python-lock"
          mkdir -m 0700 "$evidence"
          case "$RUNNER_OS" in
            Linux) platform=linux ;;
            macOS) platform=darwin ;;
            Windows) platform=win32 ;;
            *) exit 1 ;;
          esac
          case '${{ matrix.python }}' in
            3.11) interpreter=py311 ;;
            3.12) interpreter=py312 ;;
            3.13) interpreter=py313 ;;
            3.14) interpreter=py314 ;;
            3.15) interpreter=py315 ;;
            *) exit 1 ;;
          esac
          committed="sdk/python/locks/runtime-${platform}-${interpreter}.txt"
          if test -f "$committed"; then
            cp "$committed" "$evidence/selected.txt"
            python .github/scripts/sdk_python_lock.py --verify-lock "$evidence/selected.txt" --requirements sdk/python/requirements-test.txt
            python -m pip install --dry-run --ignore-installed --require-hashes --only-binary=:all: -r "$evidence/selected.txt"
            sha256sum sdk/python/requirements-test.txt "$evidence/selected.txt" > "$evidence/inputs.sha256"
            echo 'missing=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m pip install --dry-run --ignore-installed --only-binary=:all: --report "$evidence/report.json" -r sdk/python/requirements-test.txt
          python .github/scripts/sdk_python_lock.py --report "$evidence/report.json" --output "$evidence/generated.txt" --receipt "$evidence/receipt.txt" --revision "$(git rev-parse HEAD)" --requirements sdk/python/requirements-test.txt
          sha256sum sdk/python/requirements-test.txt "$evidence/generated.txt" > "$evidence/inputs.sha256"
          echo 'missing=true' >> "$GITHUB_OUTPUT"
      - name: Upload generated Python lock evidence
