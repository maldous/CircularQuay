      CQ_PYTHON_PATCH: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ env.CQ_NATIVE_FEATURE_SHA }}
          fetch-depth: 3
          persist-credentials: false
      - name: Verify the frozen feature and disposable Intel runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$CQ_NATIVE_FEATURE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CQ_NATIVE_FEATURE_TREE"
          test "$(git rev-parse 'HEAD^2')" = "$CQ_NATIVE_INPUT_SHA"
          test "$(git rev-parse 'HEAD^2^')" = 2d8f19216e1b03cb6cdd6132b17b4e97c7f103c4
          test "$(git ls-remote --exit-code origin refs/heads/feature/initial-implementation)" = "$(printf '%s\trefs/heads/feature/initial-implementation' "$CQ_NATIVE_FEATURE_SHA")"
          test "$RUNNER_OS/$RUNNER_ARCH/$(uname -m)" = macOS/X64/x86_64
          test "${ImageVersion:?runner image identity required}" = 20260824.0482.1
          test "$(/usr/bin/xcodebuild -version)" = "$(printf 'Xcode 16.4\nBuild version 16F6')"
          test "$(/usr/bin/xcrun --sdk macosx --show-sdk-version)" = 15.5
          case "$CQ_PYTHON_PATCH" in 3.11.9|3.12.10|3.13.17|3.14.10|3.15.2) ;; *) exit 1 ;; esac
          root="$RUNNER_TEMP/cq-darwin-wheels-$CQ_PYTHON_PATCH"
          mkdir -m 0700 "$root"
