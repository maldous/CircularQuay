name: Ephemeral SonarQube gate

on:
  pull_request:
    branches: [develop, main, 'release/**']

permissions:
  contents: read
  # Read only fixed current same-repository original Source/SDK/Browser evidence.
  actions: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    # This stable name is bound to the protected-branch required check.
    name: Hosted ephemeral SonarQube gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      GOFLAGS: -p=1 -mod=readonly
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: analyzer-python
        with: { python-version: '3.14.3', check-latest: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14', check-latest: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Locate the authenticated current Source platform union
        id: source_union
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -I -S -B .github/scripts/source_union_intake.py discover --source "$GITHUB_WORKSPACE" --expected-commit "$GITHUB_SHA" --head '${{ github.event.pull_request.head.sha }}' --pr '${{ github.event.pull_request.number }}' --sonar-run "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/cq-sonar-source-union-binding-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --step-output "$GITHUB_OUTPUT"
      - name: Download only the authenticated Source union archive
        id: source_union_archive
        if: ${{ steps.source_union.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: maldous/CircularQuay
          run-id: ${{ steps.source_union.outputs.run_id }}
          artifact-ids: ${{ steps.source_union.outputs.artifact_id }}
          path: ${{ runner.temp }}/cq-sonar-source-union-archives-${{ github.run_id }}-${{ github.run_attempt }}
          skip-decompress: true
      - name: Locate authenticated native Windows Python counters
        id: native_python
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -I -S -B .github/scripts/python_coverage.py discover --source "$GITHUB_WORKSPACE" --expected-commit "$GITHUB_SHA" --head '${{ github.event.pull_request.head.sha }}' --pr '${{ github.event.pull_request.number }}' --sonar-run "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/cq-sonar-python-binding-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --step-output "$GITHUB_OUTPUT"
      - name: Download only the authenticated native Python archive
        id: native_python_archive
        if: ${{ steps.native_python.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: maldous/CircularQuay
          run-id: ${{ steps.native_python.outputs.run_id }}
          artifact-ids: ${{ steps.native_python.outputs.artifact_id }}
          path: ${{ runner.temp }}/cq-sonar-python-archives-${{ github.run_id }}-${{ github.run_attempt }}
          skip-decompress: true
      - name: Locate authenticated original native Browser evidence
        id: native_browser
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -I -S -B .github/scripts/browser_coverage_intake.py discover --source "$GITHUB_WORKSPACE" --sonar-run "$GITHUB_RUN_ID" --expected-commit "$GITHUB_SHA" --head '${{ github.event.pull_request.head.sha }}' --pr '${{ github.event.pull_request.number }}' --output "$RUNNER_TEMP/cq-sonar-browser-binding-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --step-output "$GITHUB_OUTPUT"
      - name: Download only authenticated Browser linux counters
        id: native_browser_linux
        if: ${{ steps.native_browser.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: maldous/CircularQuay
          run-id: ${{ steps.native_browser.outputs.run_id }}
          artifact-ids: ${{ steps.native_browser.outputs.artifact_linux }}
          path: ${{ runner.temp }}/cq-sonar-browser-archives-${{ github.run_id }}-${{ github.run_attempt }}/linux
          skip-decompress: true
      - name: Download only authenticated Browser macos counters
        id: native_browser_macos
        if: ${{ steps.native_browser.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: maldous/CircularQuay
          run-id: ${{ steps.native_browser.outputs.run_id }}
          artifact-ids: ${{ steps.native_browser.outputs.artifact_macos }}
          path: ${{ runner.temp }}/cq-sonar-browser-archives-${{ github.run_id }}-${{ github.run_attempt }}/macos
          skip-decompress: true
      - name: Download only authenticated Browser windows counters
        id: native_browser_windows
        if: ${{ steps.native_browser.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: maldous/CircularQuay
          run-id: ${{ steps.native_browser.outputs.run_id }}
          artifact-ids: ${{ steps.native_browser.outputs.artifact_windows }}
          path: ${{ runner.temp }}/cq-sonar-browser-archives-${{ github.run_id }}-${{ github.run_attempt }}/windows
          skip-decompress: true
      - name: Produce fresh isolated Sonar evidence
        env:
          CQ_ANALYZER_PYTHON: ${{ steps.analyzer-python.outputs.python-path }}
          CQ_SOURCE_UNION_TOKEN: ${{ github.token }}
          CQ_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CQ_SONAR_GATE_NATIVE_PYTHON_READY: ${{ steps.native_python.outputs.ready }}
          CQ_SONAR_GATE_NATIVE_PYTHON_ARCHIVE: ${{ steps.native_python_archive.outcome }}
          CQ_SONAR_GATE_NATIVE_PYTHON_SHA: ${{ steps.native_python.outputs.binding_sha256 }}
          CQ_SONAR_GATE_NATIVE_BROWSER_READY: ${{ steps.native_browser.outputs.ready }}
          CQ_SONAR_GATE_NATIVE_BROWSER_LINUX: ${{ steps.native_browser_linux.outcome }}
          CQ_SONAR_GATE_NATIVE_BROWSER_MACOS: ${{ steps.native_browser_macos.outcome }}
          CQ_SONAR_GATE_NATIVE_BROWSER_WINDOWS: ${{ steps.native_browser_windows.outcome }}
          CQ_SONAR_GATE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CQ_SONAR_GATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CQ_SONAR_GATE_NATIVE_BROWSER_SHA: ${{ steps.native_browser.outputs.binding_sha256 }}
          CQ_SONAR_GATE_SOURCE_UNION_READY: ${{ steps.source_union.outputs.ready }}
          CQ_SONAR_GATE_SOURCE_UNION_ARCHIVE: ${{ steps.source_union_archive.outcome }}
          CQ_SONAR_GATE_SOURCE_UNION_SHA: ${{ steps.source_union.outputs.binding_sha256 }}
        shell: bash
        run: exec bash --noprofile --norc -e -o pipefail .github/scripts/sonar_gate.sh
      - name: Upload redacted Sonar evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-ephemeral-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.CQ_SONAR_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14

