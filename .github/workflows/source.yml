name: Source checks

on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: [develop, main, 'feature/**', 'release/**', 'hotfix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Linux synthetic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      CQ_COVERAGE_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      descriptor: ${{ steps.native_counters.outputs.descriptor }}
      artifact_id: ${{ steps.upload_platform.outputs.artifact-id }}
      artifact_sha256: ${{ steps.upload_platform.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Formatting and module integrity
        id: gofmt_diagnostic
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # This independent check precedes all fragile unit/helper suites.
          # Retain the complete original streams within bounds, not just -l
          # filenames swallowed by command substitution. Overflow is NOT clean.
          python3 -I - <<'CQ_FORMATTER'
          import contextlib
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import selectors
          import shutil
          import signal
          import stat
          import subprocess
          import sys
          import time

          def require(value):
              if not value:
                  raise ValueError('Pinned complete formatter diagnostic refused')

          def stop_group(process):
              try:
                  os.killpg(process.pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  pass
              try:
                  os.killpg(process.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              process.wait(timeout=5)

          def capture(argv, streams, limits, deadline=120):
              process = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
              poll = selectors.DefaultSelector()
              sizes = {name: 0 for name in streams}
              hashes = {name: hashlib.sha256() for name in streams}
              kept = {name: 0 for name in streams}
              overflow, timed_out, eof = False, False, False
              started = time.monotonic()
              poll.register(process.stdout, selectors.EVENT_READ, 'stdout')
              poll.register(process.stderr, selectors.EVENT_READ, 'stderr')
              try:
                  while poll.get_map():
                      for key, _ in poll.select(0.1):
                          chunk = os.read(key.fd, 65536)
                          if not chunk:
                              poll.unregister(key.fileobj)
                              continue
                          name = key.data
                          sizes[name] += len(chunk)
                          retained = chunk[:max(0, limits[name] - kept[name])]
                          streams[name].write(retained)
                          hashes[name].update(retained)
                          kept[name] += len(retained)
                          overflow = overflow or sizes[name] > limits[name]
                      timed_out = time.monotonic() - started > deadline
                      if overflow or timed_out:
                          stop_group(process)
                          break
                  eof = not poll.get_map()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      timed_out = True
                      stop_group(process)
              finally:
                  poll.close()
                  process.stdout.close()
                  process.stderr.close()
                  if process.poll() is None:
                      stop_group(process)
              complete = eof and not overflow and not timed_out
              result = {'complete': complete, 'overflow': overflow, 'timed_out': timed_out,
                        'observed_exit_code': process.returncode,
                        'original_exit_code': process.returncode if complete else None}
              for name in streams:
                  streams[name].flush()
                  result[name] = {'observed_bytes': sizes[name], 'retained_bytes': kept[name],
                                  'sha256': hashes[name].hexdigest(),
                                  'hash_scope': 'whole_stream' if complete else 'retained_prefix'}
              result['has_diff'] = sizes['stdout'] > 0
              result['format_passed'] = complete and process.returncode == 0 and not any(sizes.values())
              return result

          def tracked_files():
              source = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
              require(Path.cwd().resolve(strict=True) == source)
              command = ['git', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false']
              environment = {'PATH': os.environ['PATH'], 'GIT_CONFIG_NOSYSTEM': '1',
                             'GIT_CONFIG_GLOBAL': '/dev/null', 'GIT_OPTIONAL_LOCKS': '0',
                             'GIT_NO_REPLACE_OBJECTS': '1'}
              top = subprocess.run(command + ['rev-parse', '--show-toplevel'], capture_output=True, check=True, timeout=10, env=environment)
              require(Path(top.stdout.decode().strip()).resolve(strict=True) == source and not top.stderr)
              head = subprocess.run(command + ['rev-parse', 'HEAD'], capture_output=True, check=True, timeout=10, env=environment)
              require(head.stdout.decode().strip() == os.environ['GITHUB_SHA'] and not head.stderr)
              state = subprocess.run(command + ['status', '--porcelain=v1', '--untracked-files=no'], capture_output=True, check=True, timeout=30, env=environment)
              require(not state.stdout and not state.stderr)
              result = subprocess.run(command + ['ls-files', '--stage', '-z', '--', '*.go'], capture_output=True, check=True, timeout=30, env=environment)
              require(not result.stderr and len(result.stdout) <= 4 << 20)
              files = []
              for row in result.stdout.split(b'\0'):
                  if not row:
                      continue
                  header, raw = row.split(b'\t', 1)
                  mode, blob, stage = header.split()
                  name = raw.decode('utf-8')
                  require(mode in (b'100644', b'100755') and stage == b'0' and re.fullmatch(b'[0-9a-f]{40}', blob))
                  require(not name.startswith('/') and all(part not in ('', '.', '..') for part in name.split('/')))
                  path = Path.cwd()
                  for part in name.split('/'):
                      path = path / part
                      require(not path.is_symlink())
                  require(path.is_file())
                  files.append('./' + name)
              require(bool(files))
              return files

          def selected_tools():
              go = Path(shutil.which('go')).resolve(strict=True)
              formatter = go.parent / 'gofmt'
              require(formatter.resolve(strict=True) == formatter and formatter.is_file())
              info = formatter.stat()
              require(info.st_uid in (0, os.geteuid()) and not info.st_mode & 0o022 and info.st_mode & stat.S_IXUSR)
              probe = subprocess.run([str(go), 'version'], capture_output=True, check=True, timeout=10)
              require(probe.stdout == b'go version go1.27.4 linux/amd64\n' and not probe.stderr)
              with formatter.open('rb') as stream:
                  formatter_hash = hashlib.file_digest(stream, 'sha256').hexdigest()
              return formatter, formatter_hash

          def main():
              root = Path(os.environ['RUNNER_TEMP']) / 'cq-gofmt'
              root.mkdir(mode=0o700)
              metadata = {'version': 1, 'status': 'refused', 'complete': False,
                          'scope': 'all Git-tracked regular Go files, read-only gofmt-d',
                          'source_commit': os.environ['GITHUB_SHA'], 'global_gate_passed': False,
                          'module_integrity': 'Separate following commands, not asserted by formatter receipt'}
              with contextlib.ExitStack() as stack:
                  streams = {}
                  for name, file in (('stdout', 'stdout.diff'), ('stderr', 'stderr.txt')):
                      descriptor = os.open(root / file, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                      streams[name] = stack.enter_context(os.fdopen(descriptor, 'wb'))
                  try:
                      files = tracked_files()
                      formatter, formatter_hash = selected_tools()
                      metadata.update(capture([str(formatter), '-d', *files], streams,
                                              {'stdout': 8 << 20, 'stderr': 1 << 20}))
                      metadata.update(files=len(files), go_version='go1.27.4 linux/amd64', gofmt_sha256=formatter_hash,
                                      status='passed' if metadata['format_passed'] else 'failed')
                  except (OSError, ValueError, TypeError, subprocess.SubprocessError):
                      metadata.update(status='refused', complete=False, format_passed=False)
              descriptor = os.open(root / 'formatter.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(descriptor, 'w', encoding='utf-8') as stream:
                  json.dump(metadata, stream, sort_keys=True)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
                  stream.write('retained=true\n')
              print(json.dumps(metadata, sort_keys=True))
              return 0 if metadata.get('format_passed') else 1

          if __name__ == '__main__':
              raise SystemExit(main())
          CQ_FORMATTER
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Tests, race checks and vet
        id: native_counters
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cq_go="$(command -v go)"
          cq_counters="$RUNNER_TEMP/cq-platform-linux"
          python3 -I -B .github/scripts/platform_coverage.py begin --source "$GITHUB_WORKSPACE" --expected-commit "$GITHUB_SHA" --go "$cq_go" --platform linux --output "$cq_counters"
          set +e
          "$cq_go" test -count=1 -p=1 -covermode=atomic -coverpkg=./... "-coverprofile=$cq_counters/coverage.out" ./...
          cq_test_exit=$?
          python3 -I -B .github/scripts/platform_coverage.py retain --source "$GITHUB_WORKSPACE" --expected-commit "$GITHUB_SHA" --go "$cq_go" --platform linux --output "$cq_counters" --test-exit "$cq_test_exit" --step-output "$GITHUB_OUTPUT"
          cq_retain_exit=$?
          set -e
          if test "$cq_test_exit" -ne 0; then exit "$cq_test_exit"; fi
          if test "$cq_retain_exit" -ne 0; then exit "$cq_retain_exit"; fi
          go test -race -count=1 -p 1 ./...
          go vet -p 1 ./...
      - name: Bounded parser and policy fuzzing
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          go test -run='^$' -fuzz=FuzzCoverage -fuzztime=15s -parallel=2 ./internal/assurance
          go test -run='^$' -fuzz=FuzzDecodeNeverLeaksInput -fuzztime=15s -parallel=2 ./internal/policy
          go test -run='^$' -fuzz=FuzzEndpointNeverAcceptsCredentialURL -fuzztime=15s -parallel=2 ./internal/transport
      - name: Enforce complexity ceilings
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          go install github.com/uudashr/gocognit/cmd/gocognit@v1.3.0
          mapfile -d '' go_sources < <(git ls-files -z '*.go')
          "$GOBIN/gocyclo" -over 10 "${go_sources[@]}"
          cq_cognitive_log="$RUNNER_TEMP/cq-cognitive.log"
          # Type-aware analysis loads each native package once per owning
          # directory. Treat warnings/fallback diagnostics as a failed check.
          if ! "$GOBIN/gocognit" -exact-recursion -over 10 internal cmd sdk/go >"$cq_cognitive_log" 2>&1; then
            cat "$cq_cognitive_log"
            exit 1
          fi
          if test -s "$cq_cognitive_log"; then
            cat "$cq_cognitive_log"
            exit 1
          fi
      - name: Always retain bounded complete-or-refused formatter evidence
        if: ${{ always() && steps.gofmt_diagnostic.outputs.retained == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gofmt-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cq-gofmt/stdout.diff
            ${{ runner.temp }}/cq-gofmt/stderr.txt
            ${{ runner.temp }}/cq-gofmt/formatter.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain actual Linux counters without changing test results
        id: upload_platform
        if: ${{ always() && steps.native_counters.outputs.descriptor != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-go-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cq-platform-linux/bundle/coverage.out
            ${{ runner.temp }}/cq-platform-linux/bundle/platform-metadata.json
          if-no-files-found: error
          retention-days: 7
  native-macos:
    name: macOS synthetic tests
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      CQ_COVERAGE_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      descriptor: ${{ steps.native_counters.outputs.descriptor }}
      artifact_id: ${{ steps.upload_platform.outputs.artifact-id }}
      artifact_sha256: ${{ steps.upload_platform.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Run native synthetic tests
        id: native_counters
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Exercise Apple's protected Git/OpenSSH installation rather than a
          # package-manager helper under a potentially mutable PATH ancestor.
          export PATH="/usr/bin:/bin:$PATH"
          cq_go="$(command -v go)"
          cq_counters="$RUNNER_TEMP/cq-platform-macos"
          python3 -I -B .github/scripts/platform_coverage.py begin --source "$GITHUB_WORKSPACE" --expected-commit "$GITHUB_SHA" --go "$cq_go" --platform macos --output "$cq_counters"
          set +e
          "$cq_go" test -count=1 -p=1 -covermode=atomic -coverpkg=./... "-coverprofile=$cq_counters/coverage.out" ./...
          cq_test_exit=$?
          python3 -I -B .github/scripts/platform_coverage.py retain --source "$GITHUB_WORKSPACE" --expected-commit "$GITHUB_SHA" --go "$cq_go" --platform macos --output "$cq_counters" --test-exit "$cq_test_exit" --step-output "$GITHUB_OUTPUT"
          cq_retain_exit=$?
          set -e
          if test "$cq_test_exit" -ne 0; then exit "$cq_test_exit"; fi
          exit "$cq_retain_exit"
      - name: Retain actual macOS counters without changing test results
        id: upload_platform
        if: ${{ always() && steps.native_counters.outputs.descriptor != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-go-macos-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cq-platform-macos/bundle/coverage.out
            ${{ runner.temp }}/cq-platform-macos/bundle/platform-metadata.json
          if-no-files-found: error
          retention-days: 7
  native-windows:
    name: Windows synthetic tests
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      CQ_COVERAGE_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      descriptor: ${{ steps.native_counters.outputs.descriptor }}
      artifact_id: ${{ steps.upload_platform.outputs.artifact-id }}
      artifact_sha256: ${{ steps.upload_platform.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Run native synthetic tests
        id: native_counters
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          # Capture real native exit codes explicitly; never let retention turn
          # a failing Go invocation into a successful job.
          $PSNativeCommandUseErrorActionPreference = $false
          # Use the first executable selected by native PATH resolution, not
          # every installed Go application returned by Get-Command.
          $cqGo = (Get-Command go -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          if ([string]::IsNullOrWhiteSpace($cqGo)) { throw 'Selected Go executable is unavailable' }
          $cqCounters = Join-Path $env:RUNNER_TEMP 'cq-platform-windows'
          python -I -B .github/scripts/platform_coverage.py begin --source $env:GITHUB_WORKSPACE --expected-commit $env:GITHUB_SHA --go $cqGo --platform windows --output $cqCounters
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cqGo test -count=1 -p=1 -covermode=atomic '-coverpkg=./...' ("-coverprofile=" + (Join-Path $cqCounters 'coverage.out')) './...'
          $cqTestExit = $LASTEXITCODE
          python -I -B .github/scripts/platform_coverage.py retain --source $env:GITHUB_WORKSPACE --expected-commit $env:GITHUB_SHA --go $cqGo --platform windows --output $cqCounters --test-exit $cqTestExit --step-output $env:GITHUB_OUTPUT
          $cqRetainExit = $LASTEXITCODE
          if ($cqTestExit -ne 0) { exit $cqTestExit }
          exit $cqRetainExit
      - name: Retain actual Windows counters without changing test results
        id: upload_platform
        if: ${{ always() && steps.native_counters.outputs.descriptor != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-go-windows-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cq-platform-windows/bundle/coverage.out
            ${{ runner.temp }}/cq-platform-windows/bundle/platform-metadata.json
          if-no-files-found: error
          retention-days: 7
  cross-build:
    name: Compile ${{ matrix.tier }} ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tier: release-build, os: linux, arch: '386' }
          - { tier: release-build, os: linux, arch: arm, goarm: '7' }
          - { tier: release-build, os: linux, arch: arm64 }
          - { tier: release-build, os: linux, arch: amd64 }
          - { tier: release-build, os: linux, arch: loong64 }
          - { tier: release-build, os: linux, arch: ppc64le }
          - { tier: release-build, os: linux, arch: riscv64 }
          - { tier: release-build, os: linux, arch: s390x }
          - { tier: release-build, os: darwin, arch: amd64 }
          - { tier: release-build, os: darwin, arch: arm64 }
          - { tier: release-build, os: windows, arch: '386' }
          - { tier: release-build, os: windows, arch: amd64 }
          - { tier: release-build, os: windows, arch: arm64 }
          - { tier: portable-build, os: freebsd, arch: '386' }
          - { tier: portable-build, os: freebsd, arch: amd64 }
          - { tier: portable-build, os: freebsd, arch: arm64 }
          - { tier: portable-build, os: netbsd, arch: '386' }
          - { tier: portable-build, os: netbsd, arch: amd64 }
          - { tier: portable-build, os: netbsd, arch: arm64 }
          - { tier: portable-build, os: openbsd, arch: '386' }
          - { tier: portable-build, os: openbsd, arch: amd64 }
          - { tier: portable-build, os: openbsd, arch: arm64 }
          - { tier: portable-build, os: dragonfly, arch: amd64 }
          - { tier: portable-build, os: illumos, arch: amd64 }
          - { tier: portable-build, os: solaris, arch: amd64 }
          - { tier: compile-only, os: android, arch: arm64 }
    env:
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build both commands without installing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/build
          go build -p 1 -trimpath -o .local/build/cq ./cmd/cq
          go build -p 1 -trimpath -o .local/build/cq-audit ./cmd/cq-audit
  cross-build-gate:
    name: Cross-build matrix
    needs: cross-build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every cross-build
        shell: bash
        env:
          CQ_CROSS_BUILD_RESULT: ${{ needs.cross-build.result }}
        run: |
          set -euo pipefail
          test "$CQ_CROSS_BUILD_RESULT" = success
  assurance:
    name: Source assurance gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GOTOOLCHAIN: local
      CQ_COVERAGE_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      descriptor: ${{ steps.bind_platform_source.outputs.descriptor }}
      artifact_id: ${{ steps.upload_source_evidence.outputs.artifact-id }}
      artifact_sha256: ${{ steps.upload_source_evidence.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Check bounded evidence retention contracts
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          umask 077
          python3 --version
          python3 -B -m unittest discover -s .github/scripts/tests -p test_retain_audit_evidence.py
          python3 -B -m unittest discover -s .github/scripts/tests -p test_go_mcp_coverage.py
          python3 -B -m unittest discover -s .github/scripts/tests -p test_platform_coverage.py
          python3 -B -m unittest discover -s .github/scripts/tests -p test_source_gate.py
          python3 -B -m unittest discover -s .github/scripts/tests -p test_browser_coverage_intake.py
      # This job retains a raw single-platform observation, not whole-Source qualification.
      - name: Run and retain the actual raw source profile exit
        id: source_audit
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          umask 077
          cq_audit_dir=''
          cq_audit_dir=$(mktemp -d "${HOME}/cq-source-audit.XXXXXX")
          chmod 0700 "$cq_audit_dir"
          printf 'audit_dir=%s\n' "$cq_audit_dir" >> "$GITHUB_OUTPUT"
          cq_tool_dir="$cq_audit_dir/tools"
          cq_home_dir="$cq_audit_dir/home"
          cq_tmp_dir="$cq_audit_dir/tmp"
          cq_cache_dir="$cq_audit_dir/cache"
          mkdir -m 0700 "$cq_tool_dir" "$cq_home_dir" "$cq_tmp_dir" "$cq_cache_dir"
          mkdir -m 0700 "$cq_cache_dir/build" "$cq_cache_dir/mod"
          CQ_SELECTED_GIT=''
          CQ_SELECTED_SSH_KEYGEN=''
          CQ_SELECTED_GOROOT=''
          CQ_SELECTED_GO=''
          CQ_SELECTED_GIT="$(realpath -e /usr/bin/git)"
          CQ_SELECTED_SSH_KEYGEN="$(realpath -e /usr/bin/ssh-keygen)"
          CQ_SELECTED_GO="$(realpath -e "$(command -v go)")"
          CQ_SELECTED_GOROOT="$(realpath -e "$(dirname "$CQ_SELECTED_GO")/..")"
          test "$CQ_SELECTED_GO" = "$CQ_SELECTED_GOROOT/bin/go"
          test "$(env GOROOT="$CQ_SELECTED_GOROOT" "$CQ_SELECTED_GO" env GOVERSION)" = go1.27.4
          test -x "$CQ_SELECTED_GIT"
          test -x "$CQ_SELECTED_SSH_KEYGEN"
          test -x "$CQ_SELECTED_GO"
          test -x "$CQ_SELECTED_GOROOT/bin/gofmt"
          test ! -L "$CQ_SELECTED_GIT"
          test ! -L "$CQ_SELECTED_SSH_KEYGEN"
          test -z "$(find "$CQ_SELECTED_GOROOT" -type l -print -quit)"
          install -m 0700 "$CQ_SELECTED_GIT" "$cq_tool_dir/git"
          install -m 0700 "$CQ_SELECTED_SSH_KEYGEN" "$cq_tool_dir/ssh-keygen"
          cp -R "$CQ_SELECTED_GOROOT" "$cq_tool_dir/go"
          test -z "$(find "$cq_tool_dir" -type l -print -quit)"
          chmod -R go-rwx "$cq_tool_dir"
          CQ_GIT=''
          CQ_GIT="$(realpath -e "$cq_tool_dir/git")"
          CQ_GO="$(realpath -e "$cq_tool_dir/go/bin/go")"
          CQ_GOFMT="$(realpath -e "$cq_tool_dir/go/bin/gofmt")"
          CQ_SSH_KEYGEN="$(realpath -e "$cq_tool_dir/ssh-keygen")"
          test -x "$CQ_GIT"
          test -x "$CQ_GO"
          test -x "$CQ_GOFMT"
          test -x "$CQ_SSH_KEYGEN"
          CQ_TOOL_MANIFEST="$cq_tool_dir/manifest.json"
          env HOME="$cq_home_dir" TMPDIR="$cq_tmp_dir" GOTMPDIR="$cq_tmp_dir" \
            GOCACHE="$cq_cache_dir/build" GOMODCACHE="$cq_cache_dir/mod" GOROOT="$cq_tool_dir/go" \
            GOTOOLCHAIN=local GOMAXPROCS=2 GOFLAGS=-p=1 "$CQ_GO" build -p 1 -trimpath -o "$cq_audit_dir/cq-audit" ./cmd/cq-audit
          env HOME="$cq_home_dir" TMPDIR="$cq_tmp_dir" GOTMPDIR="$cq_tmp_dir" \
            GOCACHE="$cq_cache_dir/build" GOMODCACHE="$cq_cache_dir/mod" GOROOT="$cq_tool_dir/go" \
            CQ_GIT="$CQ_GIT" CQ_GO="$CQ_GO" CQ_GOFMT="$CQ_GOFMT" \
            CQ_TOOL_MANIFEST="$CQ_TOOL_MANIFEST" CQ_SSH_KEYGEN="$CQ_SSH_KEYGEN" python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess

          def entry(identifier, path, version_args, expected_status=0, declared_version=None):
              result = subprocess.run([path, *version_args], capture_output=True, check=False)
              if result.returncode != expected_status:
                  raise RuntimeError(f"{identifier} probe exited {result.returncode}")
              version = result.stdout + result.stderr
              with open(path, "rb") as binary:
                  digest = hashlib.file_digest(binary, "sha256").hexdigest()
              return {"id": identifier, "path": path, "sha256": digest,
                      "version": declared_version or version.decode("ascii").strip(),
                      "version_output_sha256": hashlib.sha256(version).hexdigest()}

          go_tool = entry("go", os.environ["CQ_GO"], ["version"])
          with open(os.environ["CQ_SSH_KEYGEN"], "rb") as helper:
              helper_digest = hashlib.file_digest(helper, "sha256").hexdigest()
          manifest = {"version": 1, "platform": "linux/amd64",
                      "helpers": [{"id": "ssh-keygen", "path": os.environ["CQ_SSH_KEYGEN"],
                                   "sha256": helper_digest}], "tools": [
              entry("git", os.environ["CQ_GIT"], ["--version"]),
              go_tool,
              entry("gofmt", os.environ["CQ_GOFMT"], ["-h"], 0,
                    declared_version="gofmt from " + go_tool["version"]),
          ]}
          with open(os.environ["CQ_TOOL_MANIFEST"], "x", encoding="utf-8") as output:
              json.dump(manifest, output, separators=(",", ":"))
          os.chmod(os.environ["CQ_TOOL_MANIFEST"], 0o600)
          PY
          set +e
          env HOME="$cq_home_dir" TMPDIR="$cq_tmp_dir" GOTMPDIR="$cq_tmp_dir" \
            GOCACHE="$cq_cache_dir/build" GOMODCACHE="$cq_cache_dir/mod" GOROOT="$cq_tool_dir/go" \
            GOTOOLCHAIN=local GOMAXPROCS=2 GOFLAGS=-p=1 CQ_GIT="$CQ_GIT" CQ_GO="$CQ_GO" \
            CQ_GOFMT="$CQ_GOFMT" CQ_TOOL_MANIFEST="$CQ_TOOL_MANIFEST" \
            "$cq_audit_dir/cq-audit" run --profile source --tool-manifest "$CQ_TOOL_MANIFEST" --go "$CQ_GO" --output "$cq_audit_dir/evidence"
          cq_audit_exit=$?
          set -e
          printf 'audit_exit=%s\n' "$cq_audit_exit" >> "$GITHUB_OUTPUT"
          # Preserve the actual exit. Only the two explicitly witnessed holds
          # may later resolve; crashes and all other failures stay failures.
          test "$cq_audit_exit" -eq 0 || test "$cq_audit_exit" -eq 1
      - name: Retain bounded source audit evidence
        id: retain_audit
        if: ${{ always() && steps.source_audit.outputs.audit_dir != '' }}
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          CQ_AUDIT_DIRECTORY: ${{ steps.source_audit.outputs.audit_dir }}
        run: |
          set -euo pipefail
          umask 077
          # The raw failed report and exit remain unchanged. Retention itself
          # cannot manufacture a qualification pass.
          python3 -B .github/scripts/retain_audit_evidence.py \
            --source "$GITHUB_WORKSPACE" --audit "$CQ_AUDIT_DIRECTORY/evidence" \
            --output "$RUNNER_TEMP/cq-source-evidence" --expected-commit "$GITHUB_SHA"
          test -f "$RUNNER_TEMP/cq-source-evidence/coverage.out"
          test -f "$RUNNER_TEMP/cq-source-evidence/metadata.json"
          printf 'retained=true\n' >> "$GITHUB_OUTPUT"
      - name: Validate all raw required checks without promoting unresolved holds
        if: ${{ always() && steps.retain_audit.outcome == 'success' }}
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          CQ_RAW_AUDIT_EXIT: ${{ steps.source_audit.outputs.audit_exit }}
        run: |
          set -euo pipefail
          python3 -I -B .github/scripts/source_gate.py observe --metadata "$RUNNER_TEMP/cq-source-evidence/metadata.json" --audit-exit "$CQ_RAW_AUDIT_EXIT"
      - name: Bind original Source counter artifact for same-run comparison
        id: bind_platform_source
        if: ${{ always() && steps.retain_audit.outcome == 'success' && steps.retain_audit.outputs.retained == 'true' }}
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          CQ_AUDIT_DIRECTORY: ${{ steps.source_audit.outputs.audit_dir }}
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B .github/scripts/platform_coverage.py baseline --source "$GITHUB_WORKSPACE" --expected-commit "$GITHUB_SHA" --go "$CQ_AUDIT_DIRECTORY/tools/go/bin/go" --bundle "$RUNNER_TEMP/cq-source-evidence" --step-output "$GITHUB_OUTPUT"
      - name: Upload bounded source audit evidence
        id: upload_source_evidence
        if: ${{ always() && steps.retain_audit.outcome == 'success' && steps.retain_audit.outputs.retained == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cq-source-evidence/coverage.out
            ${{ runner.temp }}/cq-source-evidence/metadata.json
          if-no-files-found: error
          retention-days: 7
  platform-coverage:
    permissions:
      contents: read
      actions: read
    name: Authoritative complete Source qualification
    needs: [tests, native-macos, native-windows, assurance, cross-build-gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CQ_COVERAGE_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bind authenticated current-run producer outputs before any download
        id: pin_platform
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          CQ_PLATFORM_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          complete = json.loads(os.environ['CQ_PLATFORM_NEEDS'])
          full = Path(os.environ['RUNNER_TEMP']) / 'cq-source-needs.json'
          with os.fdopen(os.open(full, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as stream:
              json.dump(complete, stream)
          selected = {key: complete[key] for key in ('tests', 'native-macos', 'native-windows', 'assurance')}
          path = Path(os.environ['RUNNER_TEMP']) / 'cq-platform-needs.json'
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w', encoding='utf-8') as stream:
              json.dump(selected, stream)
          PY
          # The values come from authenticated runner needs/step contexts, NOT
          # from metadata inside the artifacts. Missing IDs fail before a blank
          # download-artifact selector could accidentally select all artifacts.
          python3 -I -B .github/scripts/platform_coverage.py pins --source "$GITHUB_WORKSPACE" --expected-commit "$GITHUB_SHA" --needs "$RUNNER_TEMP/cq-platform-needs.json" --output "$RUNNER_TEMP/cq-platform-pins.json" >> "$GITHUB_OUTPUT"
      - name: Download exact same-run Linux counter archive without extracting
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.tests.outputs.artifact_id }}
          path: ${{ runner.temp }}/cq-platform-archives/linux
          skip-decompress: true
          digest-mismatch: error
      - name: Download exact same-run macOS counter archive without extracting
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs['native-macos'].outputs.artifact_id }}
          path: ${{ runner.temp }}/cq-platform-archives/macos
          skip-decompress: true
          digest-mismatch: error
      - name: Download exact same-run Windows counter archive without extracting
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs['native-windows'].outputs.artifact_id }}
          path: ${{ runner.temp }}/cq-platform-archives/windows
          skip-decompress: true
          digest-mismatch: error
      - name: Download unchanged same-run Source baseline archive without extracting
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assurance.outputs.artifact_id }}
          path: ${{ runner.temp }}/cq-platform-archives/source
          skip-decompress: true
          digest-mismatch: error
      - name: Union real counters with all original outcomes and full denominator
        id: platform_union
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          umask 077
          set +e
          python3 -I -B .github/scripts/platform_coverage.py union --source "$GITHUB_WORKSPACE" --expected-commit "$GITHUB_SHA" --artifacts "$RUNNER_TEMP/cq-platform-archives" --pins "$RUNNER_TEMP/cq-platform-pins.json" --expected-pins-sha256 '${{ steps.pin_platform.outputs.pins_sha256 }}' --output "$RUNNER_TEMP/cq-platform-union"
          cq_union_exit=$?
          set -e
          if test -f "$RUNNER_TEMP/cq-platform-union/coverage.out" && test -f "$RUNNER_TEMP/cq-platform-union/platform-union.json" && test -f "$RUNNER_TEMP/cq-platform-union/gaps.json"; then
            printf 'retained=true\n' >> "$GITHUB_OUTPUT"
          fi
          exit "$cq_union_exit"
      - name: Retain distinct aggregate evidence without promoting original reports
        if: ${{ always() && steps.platform_union.outputs.retained == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-go-union-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cq-platform-union/coverage.out
            ${{ runner.temp }}/cq-platform-union/platform-union.json
            ${{ runner.temp }}/cq-platform-union/gaps.json
          if-no-files-found: error
          retention-days: 7
      - name: Require current complete tagged witnesses and strict full-platform coverage
        id: authoritative_source
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          CQ_TAGGED_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B .github/scripts/source_gate.py qualify --source "$GITHUB_WORKSPACE" --expected-commit "$GITHUB_SHA" --union "$RUNNER_TEMP/cq-platform-union" --artifacts "$RUNNER_TEMP/cq-platform-archives" --pins "$RUNNER_TEMP/cq-platform-pins.json" --needs "$RUNNER_TEMP/cq-source-needs.json" --output "$RUNNER_TEMP/cq-authoritative-source.json"
      - name: Retain distinct authoritative Source decision
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authoritative-source-${{ github.sha }}
          path: ${{ runner.temp }}/cq-authoritative-source.json
          if-no-files-found: error
          retention-days: 7
