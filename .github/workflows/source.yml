name: Source checks

on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: [develop, main, 'feature/**', 'release/**', 'hotfix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Linux synthetic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Formatting and module integrity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' go_sources < <(git ls-files -z '*.go')
          test -z "$(gofmt -l "${go_sources[@]}")"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Tests, race checks and vet
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          go test -count=1 -p 1 ./...
          go test -race -count=1 -p 1 ./...
          go vet -p 1 ./...
      - name: Bounded parser and policy fuzzing
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          go test -run='^$' -fuzz=FuzzCoverage -fuzztime=15s -parallel=2 ./internal/assurance
          go test -run='^$' -fuzz=FuzzDecodeNeverLeaksInput -fuzztime=15s -parallel=2 ./internal/policy
          go test -run='^$' -fuzz=FuzzEndpointNeverAcceptsCredentialURL -fuzztime=15s -parallel=2 ./internal/transport
      - name: Enforce complexity ceilings
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          go install github.com/uudashr/gocognit/cmd/gocognit@v1.3.0
          mapfile -d '' go_sources < <(git ls-files -z '*.go')
          "$GOBIN/gocyclo" -over 10 "${go_sources[@]}"
          cquay_cognitive_log="$RUNNER_TEMP/cquay-cognitive.log"
          # Type-aware analysis loads each native package once per owning
          # directory. Treat warnings/fallback diagnostics as a failed check.
          if ! "$GOBIN/gocognit" -exact-recursion -over 10 internal cmd sdk/go >"$cquay_cognitive_log" 2>&1; then
            cat "$cquay_cognitive_log"
            exit 1
          fi
          if test -s "$cquay_cognitive_log"; then
            cat "$cquay_cognitive_log"
            exit 1
          fi
  native-macos:
    name: macOS synthetic tests
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Run native synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Exercise Apple's protected Git/OpenSSH installation rather than a
          # package-manager helper under a potentially mutable PATH ancestor.
          export PATH="/usr/bin:/bin:$PATH"
          go test -count=1 -p 1 ./...
  native-windows:
    name: Windows synthetic tests
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Run native synthetic tests
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          go test -count=1 -p=1 ./...
  cross-build:
    name: Compile ${{ matrix.tier }} ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tier: release-build, os: linux, arch: '386' }
          - { tier: release-build, os: linux, arch: arm, goarm: '7' }
          - { tier: release-build, os: linux, arch: arm64 }
          - { tier: release-build, os: linux, arch: amd64 }
          - { tier: release-build, os: linux, arch: loong64 }
          - { tier: release-build, os: linux, arch: ppc64le }
          - { tier: release-build, os: linux, arch: riscv64 }
          - { tier: release-build, os: linux, arch: s390x }
          - { tier: release-build, os: darwin, arch: amd64 }
          - { tier: release-build, os: darwin, arch: arm64 }
          - { tier: release-build, os: windows, arch: '386' }
          - { tier: release-build, os: windows, arch: amd64 }
          - { tier: release-build, os: windows, arch: arm64 }
          - { tier: portable-build, os: freebsd, arch: '386' }
          - { tier: portable-build, os: freebsd, arch: amd64 }
          - { tier: portable-build, os: freebsd, arch: arm64 }
          - { tier: portable-build, os: netbsd, arch: '386' }
          - { tier: portable-build, os: netbsd, arch: amd64 }
          - { tier: portable-build, os: netbsd, arch: arm64 }
          - { tier: portable-build, os: openbsd, arch: '386' }
          - { tier: portable-build, os: openbsd, arch: amd64 }
          - { tier: portable-build, os: openbsd, arch: arm64 }
          - { tier: portable-build, os: dragonfly, arch: amd64 }
          - { tier: portable-build, os: illumos, arch: amd64 }
          - { tier: portable-build, os: solaris, arch: amd64 }
          - { tier: compile-only, os: android, arch: arm64 }
    env:
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build both commands without installing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/build
          go build -p 1 -trimpath -o .local/build/cquay ./cmd/cquay
          go build -p 1 -trimpath -o .local/build/cquay-audit ./cmd/cquay-audit
  cross-build-gate:
    name: Cross-build matrix
    needs: cross-build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every cross-build
        shell: bash
        env:
          CQUAY_CROSS_BUILD_RESULT: ${{ needs.cross-build.result }}
        run: |
          set -euo pipefail
          test "$CQUAY_CROSS_BUILD_RESULT" = success
  assurance:
    name: Source assurance gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Run the actual source profile
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          umask 077
          cquay_audit_dir=''
          cquay_audit_dir=$(mktemp -d "${HOME}/cquay-source-audit.XXXXXX")
          chmod 0700 "$cquay_audit_dir"
          cquay_tool_dir="$cquay_audit_dir/tools"
          cquay_home_dir="$cquay_audit_dir/home"
          cquay_tmp_dir="$cquay_audit_dir/tmp"
          cquay_cache_dir="$cquay_audit_dir/cache"
          mkdir -m 0700 "$cquay_tool_dir" "$cquay_home_dir" "$cquay_tmp_dir" "$cquay_cache_dir"
          mkdir -m 0700 "$cquay_cache_dir/build" "$cquay_cache_dir/mod"
          CQUAY_SELECTED_GIT=''
          CQUAY_SELECTED_SSH_KEYGEN=''
          CQUAY_SELECTED_GOROOT=''
          CQUAY_SELECTED_GO=''
          CQUAY_SELECTED_GIT="$(realpath -e /usr/bin/git)"
          CQUAY_SELECTED_SSH_KEYGEN="$(realpath -e /usr/bin/ssh-keygen)"
          CQUAY_SELECTED_GO="$(realpath -e "$(command -v go)")"
          CQUAY_SELECTED_GOROOT="$(realpath -e "$(dirname "$CQUAY_SELECTED_GO")/..")"
          test "$CQUAY_SELECTED_GO" = "$CQUAY_SELECTED_GOROOT/bin/go"
          test "$(env GOROOT="$CQUAY_SELECTED_GOROOT" "$CQUAY_SELECTED_GO" env GOVERSION)" = go1.27.3
          test -x "$CQUAY_SELECTED_GIT"
          test -x "$CQUAY_SELECTED_SSH_KEYGEN"
          test -x "$CQUAY_SELECTED_GO"
          test -x "$CQUAY_SELECTED_GOROOT/bin/gofmt"
          test ! -L "$CQUAY_SELECTED_GIT"
          test ! -L "$CQUAY_SELECTED_SSH_KEYGEN"
          test -z "$(find "$CQUAY_SELECTED_GOROOT" -type l -print -quit)"
          install -m 0700 "$CQUAY_SELECTED_GIT" "$cquay_tool_dir/git"
          install -m 0700 "$CQUAY_SELECTED_SSH_KEYGEN" "$cquay_tool_dir/ssh-keygen"
          cp -R "$CQUAY_SELECTED_GOROOT" "$cquay_tool_dir/go"
          test -z "$(find "$cquay_tool_dir" -type l -print -quit)"
          chmod -R go-rwx "$cquay_tool_dir"
          CQUAY_GIT=''
          CQUAY_GIT="$(realpath -e "$cquay_tool_dir/git")"
          CQUAY_GO="$(realpath -e "$cquay_tool_dir/go/bin/go")"
          CQUAY_GOFMT="$(realpath -e "$cquay_tool_dir/go/bin/gofmt")"
          CQUAY_SSH_KEYGEN="$(realpath -e "$cquay_tool_dir/ssh-keygen")"
          test -x "$CQUAY_GIT"
          test -x "$CQUAY_GO"
          test -x "$CQUAY_GOFMT"
          test -x "$CQUAY_SSH_KEYGEN"
          CQUAY_TOOL_MANIFEST="$cquay_tool_dir/manifest.json"
          env HOME="$cquay_home_dir" TMPDIR="$cquay_tmp_dir" GOTMPDIR="$cquay_tmp_dir" \
            GOCACHE="$cquay_cache_dir/build" GOMODCACHE="$cquay_cache_dir/mod" GOROOT="$cquay_tool_dir/go" \
            GOTOOLCHAIN=local GOMAXPROCS=2 GOFLAGS=-p=1 "$CQUAY_GO" build -p 1 -trimpath -o "$cquay_audit_dir/cquay-audit" ./cmd/cquay-audit
          env HOME="$cquay_home_dir" TMPDIR="$cquay_tmp_dir" GOTMPDIR="$cquay_tmp_dir" \
            GOCACHE="$cquay_cache_dir/build" GOMODCACHE="$cquay_cache_dir/mod" GOROOT="$cquay_tool_dir/go" \
            CQUAY_GIT="$CQUAY_GIT" CQUAY_GO="$CQUAY_GO" CQUAY_GOFMT="$CQUAY_GOFMT" \
            CQUAY_TOOL_MANIFEST="$CQUAY_TOOL_MANIFEST" CQUAY_SSH_KEYGEN="$CQUAY_SSH_KEYGEN" python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess

          def entry(identifier, path, version_args, expected_status=0, declared_version=None):
              result = subprocess.run([path, *version_args], capture_output=True, check=False)
              if result.returncode != expected_status:
                  raise RuntimeError(f"{identifier} probe exited {result.returncode}")
              version = result.stdout + result.stderr
              with open(path, "rb") as binary:
                  digest = hashlib.file_digest(binary, "sha256").hexdigest()
              return {"id": identifier, "path": path, "sha256": digest,
                      "version": declared_version or version.decode("ascii").strip(),
                      "version_output_sha256": hashlib.sha256(version).hexdigest()}

          go_tool = entry("go", os.environ["CQUAY_GO"], ["version"])
          with open(os.environ["CQUAY_SSH_KEYGEN"], "rb") as helper:
              helper_digest = hashlib.file_digest(helper, "sha256").hexdigest()
          manifest = {"version": 1, "platform": "linux/amd64",
                      "helpers": [{"id": "ssh-keygen", "path": os.environ["CQUAY_SSH_KEYGEN"],
                                   "sha256": helper_digest}], "tools": [
              entry("git", os.environ["CQUAY_GIT"], ["--version"]),
              go_tool,
              entry("gofmt", os.environ["CQUAY_GOFMT"], ["-h"], 0,
                    declared_version="gofmt from " + go_tool["version"]),
          ]}
          with open(os.environ["CQUAY_TOOL_MANIFEST"], "x", encoding="utf-8") as output:
              json.dump(manifest, output, separators=(",", ":"))
          os.chmod(os.environ["CQUAY_TOOL_MANIFEST"], 0o600)
          PY
          env HOME="$cquay_home_dir" TMPDIR="$cquay_tmp_dir" GOTMPDIR="$cquay_tmp_dir" \
            GOCACHE="$cquay_cache_dir/build" GOMODCACHE="$cquay_cache_dir/mod" GOROOT="$cquay_tool_dir/go" \
            GOTOOLCHAIN=local GOMAXPROCS=2 GOFLAGS=-p=1 CQUAY_GIT="$CQUAY_GIT" CQUAY_GO="$CQUAY_GO" \
            CQUAY_GOFMT="$CQUAY_GOFMT" CQUAY_TOOL_MANIFEST="$CQUAY_TOOL_MANIFEST" \
            "$cquay_audit_dir/cquay-audit" run --profile source --tool-manifest "$CQUAY_TOOL_MANIFEST" --go "$CQUAY_GO" --output "$cquay_audit_dir/evidence"
