name: Source checks

on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: [develop, main, 'feature/**', 'release/**', 'hotfix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Linux synthetic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Formatting and module integrity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' go_sources < <(git ls-files -z '*.go')
          test -z "$(gofmt -l "${go_sources[@]}")"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Tests, race checks and vet
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          go test -count=1 -p 1 ./...
          go test -race -count=1 -p 1 ./...
          go vet -p 1 ./...
      - name: Bounded parser and policy fuzzing
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          go test -run='^$' -fuzz=FuzzCoverage -fuzztime=15s -parallel=2 ./internal/assurance
          go test -run='^$' -fuzz=FuzzDecodeNeverLeaksInput -fuzztime=15s -parallel=2 ./internal/policy
          go test -run='^$' -fuzz=FuzzEndpointNeverAcceptsCredentialURL -fuzztime=15s -parallel=2 ./internal/transport
      - name: Enforce cyclomatic complexity ceiling
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          mapfile -d '' go_sources < <(git ls-files -z '*.go')
          "$GOBIN/gocyclo" -over 10 "${go_sources[@]}"
  native-macos:
    name: macOS synthetic tests
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Run native synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Exercise Apple's protected Git/OpenSSH installation rather than a
          # package-manager helper under a potentially mutable PATH ancestor.
          export PATH="/usr/bin:/bin:$PATH"
          go test -count=1 -p 1 ./...
  native-windows:
    name: Windows synthetic tests
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Run native synthetic tests
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          go test -count=1 -p=1 ./...
  cross-build:
    name: Compile ${{ matrix.tier }} ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tier: release-build, os: linux, arch: '386' }
          - { tier: release-build, os: linux, arch: arm, goarm: '7' }
          - { tier: release-build, os: linux, arch: arm64 }
          - { tier: release-build, os: linux, arch: amd64 }
          - { tier: release-build, os: linux, arch: loong64 }
          - { tier: release-build, os: linux, arch: ppc64le }
          - { tier: release-build, os: linux, arch: riscv64 }
          - { tier: release-build, os: linux, arch: s390x }
          - { tier: release-build, os: darwin, arch: amd64 }
          - { tier: release-build, os: darwin, arch: arm64 }
          - { tier: release-build, os: windows, arch: '386' }
          - { tier: release-build, os: windows, arch: amd64 }
          - { tier: release-build, os: windows, arch: arm64 }
          - { tier: portable-build, os: freebsd, arch: '386' }
          - { tier: portable-build, os: freebsd, arch: amd64 }
          - { tier: portable-build, os: freebsd, arch: arm64 }
          - { tier: portable-build, os: netbsd, arch: '386' }
          - { tier: portable-build, os: netbsd, arch: amd64 }
          - { tier: portable-build, os: netbsd, arch: arm64 }
          - { tier: portable-build, os: openbsd, arch: '386' }
          - { tier: portable-build, os: openbsd, arch: amd64 }
          - { tier: portable-build, os: openbsd, arch: arm64 }
          - { tier: portable-build, os: dragonfly, arch: amd64 }
          - { tier: portable-build, os: illumos, arch: amd64 }
          - { tier: portable-build, os: solaris, arch: amd64 }
          - { tier: compile-only, os: android, arch: arm64 }
    env:
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build both commands without installing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/build
          go build -p 1 -trimpath -o .local/build/cquay ./cmd/cquay
          go build -p 1 -trimpath -o .local/build/cquay-audit ./cmd/cquay-audit
  assurance:
    name: Source assurance gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Run the actual source profile
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .local
          go build -trimpath -o .local/cquay-audit ./cmd/cquay-audit
          .local/cquay-audit run --profile source --go "$(command -v go)" --output audit-results/source
