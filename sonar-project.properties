sonar.projectKey=circularquay
sonar.projectName=CircularQuay
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/testdata/**,audit-results/**,dist/**,.local/**
sonar.test.exclusions=**/testdata/**
sonar.go.coverage.reportPaths=audit-results/coverage.out
sonar.qualitygate.wait=true
sonar.qualitygate.ignoreSmallChanges=false
