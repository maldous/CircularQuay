sonar.projectKey=cq
sonar.projectName=CircularQuay
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11,3.12,3.13,3.14,3.15
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,sdk/python/tests/**,sdk/typescript/**/*.test.ts,.github/scripts/tests/**,sdk/conformance/**,web/**/*.test.mjs,examples/landing-motion/**/*.test.mjs
sonar.exclusions=**/*_test.go,sdk/python/tests/**,sdk/typescript/**/*.test.ts,.github/scripts/tests/**,sdk/conformance/**,web/**/*.test.mjs,examples/landing-motion/**/*.test.mjs,**/testdata/**,audit-results/**,dist/**,.local/**
sonar.test.exclusions=**/testdata/**
sonar.go.coverage.reportPaths=audit-results/coverage.out
sonar.python.coverage.reportPaths=audit-results/python-coverage.xml
sonar.javascript.lcov.reportPaths=audit-results/typescript/lcov.info,audit-results/browser/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.ignoreSmallChanges=false
