sonar.projectKey=circularquay
sonar.projectName=CircularQuay
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11,3.12,3.13,3.14,3.15
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,sdk/python/tests/**,sdk/typescript/**/*.test.ts,.github/scripts/tests/**,sdk/conformance/**
sonar.exclusions=**/*_test.go,sdk/python/tests/**,sdk/typescript/**/*.test.ts,.github/scripts/tests/**,sdk/conformance/**,**/testdata/**,audit-results/**,dist/**,.local/**
sonar.test.exclusions=**/testdata/**
sonar.go.coverage.reportPaths=audit-results/coverage.out
sonar.qualitygate.wait=true
sonar.qualitygate.ignoreSmallChanges=false
