<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">CircularQuay: identity, policy and delivery</title>
  <desc id="desc">The v1 model joins exact provider resources and encrypted artifacts with signed grants from a trusted identity provider and authorization server. The CircularQuay policy core verifies identity, permissions, client binding and expiry before native delivery, approved snapshots or individually authorized MCP access.</desc>
  <defs>
    <marker id="delivery-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/>
    </marker>
    <marker id="identity-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="20" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif">
    <text x="40" y="56" fill="#102a43" font-size="27" font-weight="700">CircularQuay: identity, policy and delivery</text>
    <text x="40" y="89" fill="#526575" font-size="17">Approved identities. Exact permissions. Time-bound access.</text>

    <g fill="none" stroke="#0f766e" stroke-width="3">
      <path d="M285 181 H325 V307 M285 321 H325 V307"/>
      <path d="M325 307 H365" marker-end="url(#delivery-arrow)"/>
      <path d="M670 307 H715 M715 176 V466"/>
      <path d="M715 176 H760" marker-end="url(#delivery-arrow)"/>
      <path d="M715 321 H760" marker-end="url(#delivery-arrow)"/>
      <path d="M715 466 H760" marker-end="url(#delivery-arrow)"/>
    </g>
    <path d="M285 456 H518 V370" fill="none" stroke="#6d28d9" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#identity-arrow)"/>
    <text x="350" y="441" fill="#6d28d9" font-size="14">Signed grant + expiry</text>

    <rect x="40" y="140" width="245" height="82" rx="12" fill="#ffffff" stroke="#ccd8e0" stroke-width="2"/>
    <text x="58" y="171" fill="#102a43" font-size="19" font-weight="650">Existing providers</text>
    <text x="58" y="199" fill="#526575" font-size="14">Exact account · resource · field</text>

    <rect x="40" y="280" width="245" height="82" rx="12" fill="#ffffff" stroke="#ccd8e0" stroke-width="2"/>
    <text x="58" y="311" fill="#102a43" font-size="19" font-weight="650">Encrypted artifacts</text>
    <text x="58" y="339" fill="#526575" font-size="14">SOPS · age · approved Transit</text>

    <rect x="40" y="405" width="245" height="102" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="58" y="435" fill="#102a43" font-size="18" font-weight="650">Identity provider (IdP)</text>
    <text x="58" y="463" fill="#526575" font-size="14">OAuth authorization server</text>
    <text x="58" y="489" fill="#526575" font-size="14">Trusted issuer · client key</text>

    <rect x="365" y="245" width="305" height="125" rx="12" fill="#ffffff" stroke="#ccd8e0" stroke-width="2"/>
    <text x="383" y="276" fill="#102a43" font-size="19" font-weight="650">CircularQuay policy core</text>
    <text x="383" y="305" fill="#526575" font-size="14">Verify identity · scope · client binding</text>
    <text x="383" y="334" fill="#526575" font-size="14">Complete generation · earliest expiry</text>

    <rect x="760" y="135" width="385" height="82" rx="12" fill="#ffffff" stroke="#ccd8e0" stroke-width="2"/>
    <text x="778" y="166" fill="#102a43" font-size="19" font-weight="650">Native workload delivery</text>
    <text x="778" y="194" fill="#526575" font-size="14">Process · service · container</text>

    <rect x="760" y="280" width="385" height="82" rx="12" fill="#ffffff" stroke="#ccd8e0" stroke-width="2"/>
    <text x="778" y="311" fill="#102a43" font-size="19" font-weight="650">Approved snapshot / publication</text>
    <text x="778" y="339" fill="#526575" font-size="14">Signed approval · exact recipients / targets</text>

    <rect x="760" y="425" width="385" height="82" rx="12" fill="#ffffff" stroke="#ccd8e0" stroke-width="2"/>
    <text x="778" y="456" fill="#102a43" font-size="19" font-weight="650">Optional MCP</text>
    <text x="778" y="484" fill="#526575" font-size="14">Status · named action · explicit read</text>

    <text x="40" y="560" fill="#526575" font-size="15">v1 product model: identity-bound access · signed offline approval · original provider credential lifecycle</text>
  </g>
</svg>
