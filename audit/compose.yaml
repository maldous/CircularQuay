name: cq-audit
services:
  database:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_DB: sonarqube
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Run cq-audit sonar-init first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sonarqube -d sonarqube]
      interval: 5s
      timeout: 5s
      retries: 20
    # The database has no host port and remains reachable only by SonarQube on
    # the internal backend network.
    networks: [backend]
  sonarqube:
    image: sonarqube:26.10.0.133078-community@sha256:f95aaa9016dd4e92c7d70691167a6d96dbb5d8acffd61eba1cb4335d364a7840
    depends_on:
      database:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://database:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Run cq-audit sonar-init first}
      SONAR_TELEMETRY_ENABLE: "false"
      SONAR_WEB_JAVAOPTS: -Xmx512m -Xms128m
      SONAR_CE_JAVAOPTS: -Xmx512m -Xms128m
      SONAR_SEARCH_JAVAOPTS: -Xmx512m -Xms512m
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc:
        soft: 8192
        hard: 8192
    ports:
      - 127.0.0.1:${SONAR_PORT:-9000}:9000
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-logs:/opt/sonarqube/logs
      - sonar-extensions:/opt/sonarqube/extensions
    # The frontend bridge is required for the runner's loopback-only HTTP
    # readback. It does not by itself restrict SonarQube outbound egress.
    networks: [backend, frontend]
networks:
  backend:
    internal: true
  frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
volumes:
  database:
  sonar-data:
  sonar-logs:
  sonar-extensions:
