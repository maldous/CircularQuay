<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245" role="img" aria-labelledby="title desc"><title id="title">Evolving developer requirements</title><desc id="desc">Overlapping requirements progress from shell profiles and dotenv through CI, containers and managed identities to multi-platform AI workloads.</desc><rect width="1200" height="245" rx="18" fill="#f8fafc"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="24" font-weight="700" fill="#102a43">The environment changed. The boundaries multiplied.</text><path d="M68 100 H1125" stroke="#ccd8e0" stroke-width="4"/>
<circle cx="60" cy="100" r="12" fill="#0f766e"/><text x="35" y="150" fill="#102a43" font-size="18" font-weight="650">Shell profiles</text><text x="35" y="179" fill="#526575" font-size="13">One interactive session</text>
<circle cx="295" cy="100" r="12" fill="#0f766e"/><text x="270" y="150" fill="#102a43" font-size="18" font-weight="650">Project dotenv</text><text x="270" y="179" fill="#526575" font-size="13">Application-local values</text>
<circle cx="530" cy="100" r="12" fill="#0f766e"/><text x="505" y="150" fill="#102a43" font-size="18" font-weight="650">CI + containers</text><text x="505" y="179" fill="#526575" font-size="13">Separate startup boundaries</text>
<circle cx="765" cy="100" r="12" fill="#0f766e"/><text x="740" y="150" fill="#102a43" font-size="18" font-weight="650">Managed identities</text><text x="740" y="179" fill="#526575" font-size="13">Native online authorization</text>
<circle cx="1000" cy="100" r="12" fill="#0f766e"/><text x="975" y="150" fill="#102a43" font-size="18" font-weight="650">AI + many platforms</text><text x="975" y="179" fill="#526575" font-size="13">More keys, actors and scopes</text>
<text x="30" y="220" fill="#526575" font-size="13">These needs overlap; each introduced different identity, startup, distribution and recovery requirements.</text></g></svg>
