<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">CircularQuay: explicit sources, explicit delivery</title><desc id="desc">Explicit sources are resolved under protected policy and delivered to native workloads, approved copies or individually authorized MCP access.</desc><rect width="1200" height="520" rx="20" fill="#0b1723"/><g font-family="system-ui, sans-serif"><text x="40" y="56" fill="#e8f0f7" font-size="27" font-weight="700">CircularQuay: explicit sources, explicit delivery</text><text x="40" y="89" fill="#a8bdcd" font-size="17">Portable integration. Native identities. Evidence-bound guarantees.</text>
