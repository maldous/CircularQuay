[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "cq-sdk"
version = "1.0.0.dev0"
description = "Safe client adapters for CircularQuay v1"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "CircularQuay contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]

[project.urls]
Homepage = "https://github.com/maldous/CircularQuay"
Documentation = "https://github.com/maldous/CircularQuay/tree/feature/initial-implementation/sdk/python"
Repository = "https://github.com/maldous/CircularQuay"

[tool.hatch.build.targets.wheel]
packages = ["src/cq"]

[tool.hatch.build.targets.sdist]
include = ["src/cq", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.coverage.run]
source = ["cq"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests"]
